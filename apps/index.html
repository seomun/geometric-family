<style>
/* 기하학 가족 웹 공통 디자인(2026-10-20 작가 「웹페이지 정돈이 필요하다」): 웹툰 목차·쇼츠·게임 목록·링크 허브 4쪽이 같은 머리·카드·색·간격.
   정본 = tools/site_style.css → python tools/site_style.py 가 각 쪽 <!-- gf-site --> 사이에 끼운다(쪽마다 단일 HTML 유지). ⑪ 랜딩(/expedition/)은 따로. */
:root { --ink: #6b5443; --paper: #f4ecdd; --bg: #e9dfcc; --card: #fff; --hot: #FFE9A8; --kid: #FFE3EA; --adult: #E3F0FF; --r: 18px; }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: 'Gowun Dodum', sans-serif; }
.gf-wrap { max-width: 720px; margin: 0 auto; min-height: 100vh; background: var(--paper); padding: 0 16px 40px; box-shadow: 0 0 40px rgba(0,0,0,.12); }
.gf-nav { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 6px; margin: 0 -16px; padding: 10px 16px; background: rgba(244,236,221,.95); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); border-bottom: 2px solid var(--ink); overflow-x: auto; scrollbar-width: none; }
.gf-nav::-webkit-scrollbar { display: none; }
.gf-nav .brand { display: flex; align-items: center; gap: 6px; margin-right: auto; padding-right: 6px; font-family: Gaegu, sans-serif; font-weight: 700; font-size: 22px; white-space: nowrap; color: inherit; text-decoration: none; }
.gf-nav .brand svg { width: 34px; height: 20px; flex: none; }
.gf-nav a.tab { flex: none; min-height: 34px; display: inline-flex; align-items: center; padding: 0 12px; border: 2px solid var(--ink); border-radius: 17px; font-size: 14px; font-weight: 700; text-decoration: none; color: inherit; background: #fff; }
.gf-nav a.tab.on { background: var(--ink); color: #fff; }
.gf-hero { text-align: center; padding: 22px 0 4px; }
.gf-hero h1 { font-family: Gaegu, sans-serif; font-size: 40px; margin: 0; letter-spacing: 1px; line-height: 1.1; }
.gf-hero p { margin: 8px 0 0; font-size: 15px; line-height: 1.6; opacity: .85; word-break: keep-all; }
.gf-hero svg, .gf-hero .art { display: block; width: 100%; height: auto; margin: 8px 0 0; }
.gf-h2 { font-family: Gaegu, sans-serif; font-size: 26px; margin: 28px 2px 12px; padding-bottom: 6px; border-bottom: 2px solid var(--ink); }
.gf-h2 small { font-family: 'Gowun Dodum', sans-serif; font-size: 13px; opacity: .7; margin-left: 6px; }
.gf-card { display: flex; align-items: center; gap: 14px; min-height: 64px; background: var(--card); border: 2.5px solid var(--ink); border-radius: var(--r); padding: 12px 16px; margin: 0 0 12px; color: inherit; text-decoration: none; box-shadow: 4px 5px 0 var(--ink); }
a.gf-card:active, button.gf-card:active { transform: translate(2px, 3px); box-shadow: 1px 2px 0 var(--ink); }
.gf-card .ic { font-size: 30px; width: 40px; text-align: center; flex: none; }
.gf-card img.ic, .gf-card svg.ic { width: 64px; height: 64px; border-radius: 16px; font-size: 0; }
.gf-card .t { display: block; font-family: Gaegu, sans-serif; font-weight: 700; font-size: 23px; line-height: 1.15; word-break: keep-all; }
.gf-card .k { display: block; font-size: 13px; opacity: .7; }
.gf-card .d { display: block; font-size: 13.5px; opacity: .8; margin-top: 2px; line-height: 1.45; word-break: keep-all; }
.gf-card.hot { background: var(--hot); } .gf-card.off { opacity: .5; pointer-events: none; border-style: dashed; box-shadow: none; }
.gf-card.game { min-height: 104px; background: linear-gradient(135deg, #3B4A7A, #5B4A9A); color: #fff; border-color: #2c2450; box-shadow: 4px 6px 0 #2c2450; }
.gf-card.game img.ic { width: 72px; height: 72px; background: #fff; } .gf-card.game .t { font-size: 27px; } .gf-card .go { margin-left: auto; font-size: 24px; flex: none; }
.gf-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.gf-grid .gf-card { flex-direction: column; justify-content: flex-start; text-align: center; margin: 0; padding: 14px 10px 12px; gap: 8px; }
.gf-grid .gf-card .t { font-size: 20px; }
.gf-grid.kid .gf-card { background: var(--kid); } .gf-grid.adult .gf-card { background: var(--adult); }
.gf-note { margin: 22px 0 0; font-size: 13px; opacity: .7; line-height: 1.6; text-align: center; word-break: keep-all; }
.gf-foot { text-align: center; font-size: 12px; opacity: .6; padding: 28px 0 0; line-height: 1.8; }
.gf-foot a { color: inherit; }
@media (min-width: 600px) { .gf-hero h1 { font-size: 46px; } .gf-wrap { padding: 0 24px 48px; } .gf-nav { margin: 0 -24px; padding: 10px 24px; } }
@media (max-width: 440px) { .gf-nav .brand span { display: none; } .gf-nav a.tab { padding: 0 11px; } }   /* 좁은 폰: 브랜드는 도형 표시만, 메뉴 넷이 한 줄에 */
/* 홈페이지(geometricfamily.com) 전용 — tools/site_style.css(웹 공통: 색·카드·머리 메뉴) 위에 얹는다. tools/build_home.py 가 쪽마다 인라인한다.
   통일성: 색은 공통 토큰(--ink 갈색 선, --paper 종이, 노랑 #FFD84B = 인물 사전·소개 컷 바탕), 글꼴은 Gaegu(제목)·Gowun Dodum(본문), 카드는 굵은 갈색 테두리 + 아래 그림자. */
:root { --yel: #FFD84B; --sky: #DCE8F7; --navy: #2c2450; --muted: rgba(107, 84, 67, .72); }
.gf-wrap.hm { max-width: 1040px; }
.gf-nav a.tab.ghost { background: transparent; border-color: transparent; font-weight: 400; }
.hm section { scroll-margin-top: 64px; padding: 6px 0 10px; }
.hm img { display: block; max-width: 100%; height: auto; }

/* 첫 화면: 노란 판 + 세 가족 + 한 줄 + 할 일 하나(1화 보기) */
.hero { margin: 16px 0 6px; background: var(--yel); border: 2.5px solid var(--ink); border-radius: 26px; box-shadow: 4px 5px 0 var(--ink); text-align: center; overflow: hidden; }
.hero h1 { font-family: Gaegu, sans-serif; font-size: 48px; line-height: 1; margin: 26px 0 0; color: #2b211b; letter-spacing: 1px; }
.hero .tag { margin: 10px 16px 0; font-size: 17px; line-height: 1.55; color: #3d2f25; word-break: keep-all; }
.hero .art { width: 100%; max-width: 620px; aspect-ratio: 1000 / 420; margin: 6px auto 0; }
.hero .cta { margin: 0 0 24px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; padding: 0 26px; border: 2.5px solid var(--ink); border-radius: 28px; background: var(--ink); color: #fff; font: 700 18px/1.2 'Gowun Dodum', sans-serif; text-decoration: none; box-shadow: 3px 4px 0 rgba(0,0,0,.18); cursor: pointer; }
.btn:active { transform: translate(2px, 3px); box-shadow: none; }
.btn.light { background: #fff; color: var(--ink); }
.btn.yel { background: var(--yel); color: #2b211b; }
.btn.wide { width: 100%; }

.sec-h { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; font-family: Gaegu, sans-serif; font-size: 30px; margin: 34px 2px 14px; padding-bottom: 6px; border-bottom: 2px solid var(--ink); }
.sec-h small { font-family: 'Gowun Dodum', sans-serif; font-size: 14px; color: var(--muted); }
.lede { margin: -4px 2px 14px; font-size: 15px; line-height: 1.65; color: var(--muted); word-break: keep-all; }

/* 캐릭터: 폰은 옆으로 넘기기, 넓으면 3칸 */
.fams { display: grid; grid-auto-flow: column; grid-auto-columns: 78%; gap: 14px; overflow-x: auto; scroll-snap-type: x mandatory; padding: 2px 4px 14px; margin: 0 -4px; scrollbar-width: none; }
.fams::-webkit-scrollbar { display: none; }
.fam { scroll-snap-align: start; background: #fff; border: 2.5px solid var(--ink); border-radius: 22px; box-shadow: 4px 5px 0 var(--ink); overflow: hidden; }
.fam img { width: 100%; aspect-ratio: 4 / 5; object-fit: cover; background: var(--paper); }
.fam div { padding: 12px 16px 16px; border-top: 2.5px solid var(--ink); }
.fam b { font-family: Gaegu, sans-serif; font-size: 25px; } .fam i { font-style: normal; font-size: 13px; color: var(--muted); margin-left: 6px; }
.fam p { margin: 4px 0 0; font-size: 14px; line-height: 1.55; word-break: keep-all; }
.swipe { text-align: center; font-size: 12.5px; color: var(--muted); margin: -4px 0 0; }

/* 웹툰 */
.eps { display: grid; gap: 12px; }
.ep { display: flex; align-items: center; gap: 14px; background: #fff; border: 2.5px solid var(--ink); border-radius: 18px; padding: 10px 14px 10px 10px; color: inherit; text-decoration: none; box-shadow: 4px 5px 0 var(--ink); }
.ep:active { transform: translate(2px, 3px); box-shadow: 1px 2px 0 var(--ink); }
.ep img { width: 84px; height: 84px; border-radius: 12px; object-fit: cover; flex: none; border: 2px solid var(--ink); }
.ep .k { display: block; font-size: 13px; color: var(--muted); } .ep .t { display: block; font-family: Gaegu, sans-serif; font-weight: 700; font-size: 25px; line-height: 1.1; }
.ep .d { display: block; font-size: 13.5px; line-height: 1.45; margin-top: 2px; word-break: keep-all; }
.ep .go { margin-left: auto; font-size: 22px; flex: none; }
.ep.first { background: var(--yel); }
.more { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin: 16px 0 0; font-size: 14px; }
.more a { color: inherit; }

/* 게임 */
.exp { position: relative; display: block; border: 2.5px solid var(--navy); border-radius: 22px; overflow: hidden; background: linear-gradient(135deg, #3B4A7A, #5B4A9A); color: #fff; text-decoration: none; box-shadow: 4px 6px 0 var(--navy); }
.exp img { width: 100%; aspect-ratio: 1024 / 500; object-fit: cover; }
.exp .body { padding: 14px 16px 18px; }
.exp .line { margin: 0 0 10px; font-size: 15px; line-height: 1.55; word-break: keep-all; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 14px; padding: 0; list-style: none; }
.chips li { padding: 4px 11px; border-radius: 14px; background: rgba(255,255,255,.16); font-size: 13px; }
.stores { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 0; }
.store { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 14px; border: 2px dashed currentColor; border-radius: 12px; font-size: 13.5px; opacity: .85; color: inherit; text-decoration: none; }
.store b { font-weight: 700; } .store small { font-size: 12px; opacity: .8; }
a.store { border-style: solid; opacity: 1; }
.apps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 12px; }
.app { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 6px 10px; background: var(--adult); border: 2px solid var(--ink); border-radius: 18px; color: inherit; text-decoration: none; text-align: center; }
.app.kid { background: var(--kid); }
.app img { width: 64px; height: 64px; border-radius: 16px; background: #fff; }
.app b { font-family: Gaegu, sans-serif; font-size: 17px; line-height: 1.1; word-break: keep-all; }
.legend { display: flex; gap: 12px; justify-content: center; font-size: 12.5px; color: var(--muted); margin: 10px 0 0; }
.legend i { display: inline-block; width: 11px; height: 11px; border-radius: 3px; border: 1.5px solid var(--ink); vertical-align: -1px; margin-right: 4px; }

/* 영상: 쇼츠는 그림만 먼저(가볍게), 누르면 유튜브가 열린다 */
.shorts { display: grid; grid-auto-flow: column; grid-auto-columns: 42%; gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory; padding: 2px 2px 12px; scrollbar-width: none; }
.shorts::-webkit-scrollbar { display: none; }
.yt { position: relative; display: block; width: 100%; aspect-ratio: 9 / 16; border: 2.5px solid var(--ink); border-radius: 16px; overflow: hidden; background: #2b211b; scroll-snap-align: start; padding: 0; cursor: pointer; color: #fff; text-align: left; font: inherit; }
.yt img { width: 100%; height: 100%; object-fit: cover; opacity: .92; }
.yt .p { position: absolute; left: 50%; top: 42%; width: 54px; height: 54px; margin: -27px 0 0 -27px; border-radius: 50%; background: rgba(0,0,0,.55); }
.yt .p::after { content: ''; position: absolute; left: 21px; top: 16px; border-left: 17px solid #fff; border-top: 11px solid transparent; border-bottom: 11px solid transparent; }
.yt .cap { position: absolute; left: 0; right: 0; bottom: 0; padding: 26px 10px 10px; background: linear-gradient(transparent, rgba(0,0,0,.75)); font-size: 13.5px; line-height: 1.35; word-break: keep-all; }
.yt iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.yt.wide { aspect-ratio: 16 / 9; }
.tale { margin-top: 22px; background: var(--sky); border: 2.5px solid var(--ink); border-radius: 22px; padding: 16px; box-shadow: 4px 5px 0 var(--ink); }
.tale b { display: block; font-family: Gaegu, sans-serif; font-size: 25px; }
.tale p { margin: 4px 0 12px; font-size: 14px; line-height: 1.6; word-break: keep-all; }
.soon { display: flex; align-items: center; justify-content: center; min-height: 120px; border: 2px dashed var(--ink); border-radius: 16px; font-size: 15px; color: var(--muted); background: rgba(255,255,255,.5); text-align: center; padding: 12px; }

/* IP·협업 */
.ip { background: #fff; border: 2.5px solid var(--ink); border-radius: 22px; padding: 18px 16px; box-shadow: 4px 5px 0 var(--ink); }
.ip .one { margin: 0 0 14px; font-size: 16px; line-height: 1.65; word-break: keep-all; }
.nums { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin: 0 0 16px; }
.nums div { background: var(--paper); border-radius: 14px; padding: 10px 12px; }
.nums b { display: block; font-family: Gaegu, sans-serif; font-size: 26px; line-height: 1.1; } .nums span { font-size: 13px; color: var(--muted); }
.chan { margin: 0 0 16px; padding: 0; list-style: none; font-size: 14px; line-height: 2; }
.chan a { color: inherit; }
.ip .offer { margin: 0 0 14px; font-size: 14.5px; line-height: 1.6; word-break: keep-all; }

/* 문의·바닥 */
.contact { text-align: center; padding: 8px 0 0; }
.contact p { font-size: 14.5px; line-height: 1.65; margin: 0 0 14px; word-break: keep-all; }
.foot { margin-top: 40px; padding: 18px 0 0; border-top: 2px solid var(--ink); font-size: 12.5px; line-height: 1.9; color: var(--muted); text-align: center; word-break: keep-all; }
.foot nav { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 14px; margin-bottom: 8px; font-size: 14px; }
.foot nav a { color: var(--ink); font-weight: 700; }
.foot a { color: inherit; }

/* 2차(10/27 작가 방향): 세계관 → 지금 만날 이야기 → 라이선싱 → 함께해요 */
.hero .tag b { font-family: Gaegu, sans-serif; font-size: 1.35em; color: #2b211b; }
.together { margin: 22px 0 0; background: #fff; border: 2.5px solid var(--ink); border-radius: 22px; padding: 16px 16px 6px; box-shadow: 4px 5px 0 var(--ink); }
.together h3 { margin: 0 0 10px; font-family: Gaegu, sans-serif; font-size: 25px; line-height: 1.2; word-break: keep-all; }
.together ul { margin: 0; padding: 0; list-style: none; }
.together li { display: flex; gap: 12px; padding: 12px 0; border-top: 1.5px dashed rgba(107,84,67,.35); }
.together li:first-child { border-top: 0; }
.together .ic { flex: none; width: 52px; height: 52px; border-radius: 16px; background: var(--yel); border: 2px solid var(--ink); display: flex; align-items: center; justify-content: center; font: 700 15px/1 'Gowun Dodum', sans-serif; letter-spacing: -1px; }
.together li > span:last-child { display: flex; flex-direction: column; gap: 3px; font-size: 14px; line-height: 1.55; word-break: keep-all; }
.together b { font-size: 16px; } .together a { color: #3b5bb5; font-size: 13.5px; }
.bigs { display: grid; gap: 18px; }
.big { position: relative; border: 2.5px solid var(--ink); border-radius: 24px; padding: 18px 16px 16px; box-shadow: 4px 6px 0 var(--ink); overflow: hidden; }
.big.toon { background: var(--yel); }
.big.game { background: linear-gradient(135deg, #3B4A7A, #5B4A9A); color: #fff; border-color: var(--navy); box-shadow: 4px 6px 0 var(--navy); }
.big .kind { display: inline-block; padding: 3px 12px; border-radius: 12px; background: var(--ink); color: #fff; font-size: 13px; font-weight: 700; }
.big.game .kind { background: #fff; color: var(--navy); }
.big h3 { font-family: Gaegu, sans-serif; font-size: 32px; margin: 8px 0 4px; line-height: 1.1; }
.big p { margin: 0 0 12px; font-size: 14.5px; line-height: 1.6; word-break: keep-all; }
.big .more { margin: 10px 0 0; } .big.game .more a { color: #fff; }
.epstrip { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 0 0 14px; }
.epstrip a { color: inherit; text-decoration: none; font-size: 12.5px; text-align: center; font-weight: 700; }
.epstrip img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 12px; border: 2px solid var(--ink); margin-bottom: 4px; background: #fff; }
.expimg img { width: 100%; border-radius: 14px; margin: 10px 0 6px; aspect-ratio: 1024 / 500; object-fit: cover; }
.big.game .stores { color: #fff; }
.mini-h { margin: 16px 0 8px !important; font-size: 13px !important; opacity: .85; }
.appstrip { display: flex; flex-wrap: wrap; gap: 8px; }
.appstrip img { width: 44px; height: 44px; border-radius: 12px; background: #fff; border: 1.5px solid rgba(255,255,255,.6); }
.smalls { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 18px 0 0; }
.small { display: flex; flex-direction: column; gap: 3px; padding: 10px 10px; background: #fff; border: 2px solid var(--ink); border-radius: 14px; color: inherit; text-decoration: none; font-size: 12px; line-height: 1.4; word-break: keep-all; }
.small b { font-size: 13.5px; }
.shorts.mini { grid-auto-columns: 30%; margin-top: 10px; }
.shorts.mini .cap { font-size: 11.5px; padding: 18px 7px 7px; } .shorts.mini .p { width: 40px; height: 40px; margin: -20px 0 0 -20px; } .shorts.mini .p::after { left: 15px; top: 11px; border-left-width: 13px; border-top-width: 9px; border-bottom-width: 9px; }
.road { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 16px 0 0; font-size: 13.5px; }
.road b { margin-right: 4px; }
.road span { padding: 4px 11px; border: 1.5px dashed var(--ink); border-radius: 14px; background: rgba(255,255,255,.55); }
.merch { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin: 0 0 18px; }
.merch figure { margin: 0; background: #fff; border: 2.5px solid var(--ink); border-radius: 18px; overflow: hidden; box-shadow: 3px 4px 0 var(--ink); }
.merch img { width: 100%; aspect-ratio: 1; object-fit: cover; }
.merch figcaption { padding: 7px 10px; font-family: Gaegu, sans-serif; font-weight: 700; font-size: 19px; text-align: center; border-top: 2px solid var(--ink); }
.steps { counter-reset: s; display: grid; gap: 10px; margin: 0 0 18px; padding: 0; list-style: none; }
.steps li { counter-increment: s; display: flex; align-items: center; gap: 12px; background: var(--paper); border: 2px solid var(--ink); border-radius: 16px; padding: 10px 14px; font-size: 14px; line-height: 1.45; word-break: keep-all; }
.steps li::before { content: counter(s); flex: none; width: 34px; height: 34px; border-radius: 50%; background: var(--ink); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; }
.steps b { font-family: Gaegu, sans-serif; font-size: 21px; margin-right: 6px; white-space: nowrap; }
.center { text-align: center; }
.cta-box { margin: 30px 0 0; background: var(--yel); border: 2.5px solid var(--ink); border-radius: 26px; padding: 26px 18px 22px; text-align: center; box-shadow: 4px 5px 0 var(--ink); }
.cta-box h2 { font-family: Gaegu, sans-serif; font-size: 40px; margin: 0 0 6px; line-height: 1.1; }
.cta-box p { margin: 0 0 16px; font-size: 15.5px; line-height: 1.6; word-break: keep-all; }
.cta-box .mail { margin: 12px 0 0; font-size: 13px; color: #5a4535; }
@media (min-width: 700px) {
  .bigs { grid-template-columns: 1fr 1fr; align-items: start; }
  .merch { grid-template-columns: repeat(4, 1fr); }
  .steps { grid-template-columns: repeat(3, 1fr); }
  .steps li { flex-direction: column; align-items: flex-start; }
  .shorts.mini { grid-auto-flow: row; grid-template-columns: repeat(4, 1fr); max-width: 560px; }
  .together ul { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0 18px; }
  .together li { border-top: 0; flex-direction: column; }
}

/* 문서 쪽(방침·약관·앱 소개) */
.doc { padding: 10px 0 0; }
.doc h1 { font-family: Gaegu, sans-serif; font-size: 38px; margin: 22px 0 4px; line-height: 1.15; }
.doc .meta { font-size: 13px; color: var(--muted); margin: 0 0 18px; }
.doc h2 { font-family: Gaegu, sans-serif; font-size: 26px; margin: 30px 0 8px; padding-bottom: 4px; border-bottom: 2px solid var(--ink); scroll-margin-top: 64px; }
.doc h3 { font-size: 16px; margin: 18px 0 6px; }
.doc p, .doc li { font-size: 15px; line-height: 1.75; word-break: keep-all; }
.doc ul, .doc ol { padding-left: 20px; margin: 6px 0; }
.doc a { color: #3b5bb5; }
.doc code { font-size: 13px; background: #fff; padding: 1px 5px; border-radius: 5px; border: 1px solid rgba(107,84,67,.25); }
.doc .lead { font-size: 16px; }
.doc .note { font-size: 13.5px; color: var(--muted); }
.doc .sum { background: #fff; border: 2.5px solid var(--ink); border-radius: 18px; padding: 14px 16px 10px; box-shadow: 4px 5px 0 var(--ink); margin: 16px 0; }
.doc .sum > b { font-family: Gaegu, sans-serif; font-size: 22px; }
.doc table { width: 100%; border-collapse: collapse; margin: 8px 0 12px; background: #fff; font-size: 13.5px; line-height: 1.55; border: 2px solid var(--ink); border-radius: 12px; overflow: hidden; display: block; overflow-x: auto; }
.doc th, .doc td { border-bottom: 1px solid rgba(107,84,67,.22); padding: 8px 10px; text-align: left; vertical-align: top; word-break: keep-all; }
.doc th { background: var(--paper); white-space: nowrap; }
.doc .toc { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 8px; padding: 0; list-style: none; }
.doc .toc a { display: inline-block; padding: 4px 10px; border: 1.5px solid var(--ink); border-radius: 14px; font-size: 13px; color: var(--ink); text-decoration: none; background: #fff; }

/* 앱 소개 쪽 */
.apphead { display: flex; gap: 16px; align-items: center; margin: 22px 0 12px; }
.apphead img { width: 96px; height: 96px; border-radius: 22px; border: 2.5px solid var(--ink); flex: none; background: #fff; }
.apphead h1 { margin: 0; }
.apphead .meta { margin: 4px 0 0; }
.appwide { width: 100%; border: 2.5px solid var(--ink); border-radius: 18px; margin: 4px 0 14px; }

@media (min-width: 700px) {
  .hero { display: grid; grid-template-columns: 1fr 1.25fr; align-items: center; text-align: left; padding: 0 0 0 36px; }
  .hero h1 { font-size: 64px; margin-top: 0; } .hero .tag { margin: 12px 0 22px; font-size: 19px; } .hero .cta { margin: 0; }
  .hero .art { grid-column: 2; grid-row: 1 / span 3; margin: 26px 0 18px; }
  .fams { grid-auto-flow: row; grid-template-columns: repeat(3, 1fr); overflow: visible; }
  .swipe { display: none; }
  .eps { grid-template-columns: 1fr 1fr; }
  .games2 { display: grid; grid-template-columns: 1.1fr 1fr; gap: 22px; align-items: start; }
  .apps { grid-template-columns: repeat(4, 1fr); margin-top: 0; }
  .shorts { grid-auto-flow: row; grid-template-columns: repeat(4, 1fr); overflow: visible; }
  .vid2 { display: grid; grid-template-columns: 1fr; }
  .nums { grid-template-columns: repeat(4, 1fr); }
  .doc { max-width: 760px; margin: 0 auto; }
}

/* 이렇게 쓰이고 있어요 */
.cases { display: grid; gap: 16px; }
.case { background: #fff; border: 2.5px solid var(--ink); border-radius: 22px; padding: 14px 14px 16px; box-shadow: 4px 5px 0 var(--ink); }
.case .kind { display: inline-block; padding: 3px 12px; border-radius: 12px; background: var(--ink); color: #fff; font-size: 13px; font-weight: 700; }
.case h3 { font-family: Gaegu, sans-serif; font-size: 26px; margin: 6px 0 8px; line-height: 1.15; }
.case p { margin: 10px 0 8px; font-size: 14px; line-height: 1.6; word-break: keep-all; }
.case .lnk { display: inline-block; margin-right: 12px; font-size: 14px; font-weight: 700; color: #3b5bb5; }
.cm { display: flex; gap: 8px; justify-content: center; align-items: flex-start; }
.cm.vid .yt { max-width: 170px; }
.cm.shots img { width: calc(50% - 4px); border: 2px solid var(--ink); border-radius: 12px; }
.cm.cuts { overflow: hidden; gap: 6px; }
.cm.cuts img { width: calc(33.3% - 4px); aspect-ratio: 1 / 1; border: 2px solid var(--ink); border-radius: 8px; object-fit: cover; }
/* /games/ */
.games h2 small, .games h3 small { font-family: 'Gowun Dodum', sans-serif; font-size: 13px; color: var(--muted); font-weight: 400; }
.games .kind { display: inline-block; padding: 3px 12px; border-radius: 12px; background: var(--ink); color: #fff; font-size: 13px; font-weight: 700; }
.flag { background: linear-gradient(135deg, #3B4A7A, #5B4A9A); color: #fff; border: 2.5px solid var(--navy); border-radius: 24px; padding: 16px 16px 18px; box-shadow: 4px 6px 0 var(--navy); margin: 18px 0 8px; }
.flag .kind { background: #fff; color: var(--navy); }
.flag h2 { border: 0; margin: 0; padding: 0; font-size: 30px; } .flag h3 { color: #fff; font-size: 18px; margin: 20px 0 8px; }
.flag .meta { color: #e8e2ff; margin: 2px 0 0; font-size: 13.5px; line-height: 1.5; }
.flag a { color: #fff; } .flag .note { color: #d9d3f5; }
.flaghead { display: flex; gap: 12px; align-items: center; margin: 10px 0 12px; } .flaghead .fi { border-radius: 16px; border: 2px solid #fff; }
.flag .appwide { width: 100%; height: auto; border-radius: 14px; border: 2px solid #fff; }
.spec { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 12px 0 0; }
.spec div { background: rgba(255,255,255,.14); border-radius: 12px; padding: 8px 10px; }
.spec dt { font-size: 12px; color: #d9d3f5; } .spec dd { margin: 2px 0 0; font-size: 14px; font-weight: 700; line-height: 1.4; word-break: keep-all; }
.loop, .money { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.loop li, .money li { display: flex; flex-direction: column; gap: 2px; background: rgba(255,255,255,.14); border-radius: 12px; padding: 9px 12px; font-size: 14px; line-height: 1.5; word-break: keep-all; }
.flag .loop li { list-style: none; } .loop b, .money b { font-size: 15px; }
.grades { display: flex; flex-wrap: wrap; gap: 8px; list-style: none; padding: 0; margin: 0 0 8px; }
.grades li { display: flex; flex-direction: column; align-items: center; min-width: 58px; padding: 8px 10px; border-radius: 12px; border: 2px solid #fff; background: rgba(255,255,255,.12); font-size: 12px; }
.grades b { font-family: Gaegu, sans-serif; font-size: 24px; line-height: 1; }
.grades .g-s { background: #6C7BD9; } .grades .g-ss { background: #E8870F; } .grades .g-sss { background: linear-gradient(135deg, #FFD84B, #FF8FA8); color: #2b211b; }
.shotrow { display: grid; grid-auto-flow: column; grid-auto-columns: 46%; gap: 8px; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 6px; scrollbar-width: none; }
.shotrow img { width: 100%; height: auto; border-radius: 12px; border: 2px solid #fff; scroll-snap-align: start; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 18px 0 0; }
.actions .btn.light { color: var(--ink); }
.lineup { display: grid; gap: 14px; margin: 10px 0 18px; }
.lu { background: #fff; border: 2.5px solid var(--ink); border-radius: 20px; padding: 10px 12px 14px; box-shadow: 3px 4px 0 var(--ink); }
.lu.kid { background: #fff7d9; }
.lu img { width: 100%; height: auto; aspect-ratio: 1024 / 500; object-fit: cover; border-radius: 12px; border: 2px solid var(--ink); }
.lu h3 { font-family: Gaegu, sans-serif; font-size: 24px; margin: 8px 0 2px; } .lu .one { margin: 0 0 8px; font-size: 13.5px; line-height: 1.55; color: var(--muted); }
.lu dl { display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; margin: 0 0 10px; font-size: 13px; line-height: 1.5; }
.lu dt { color: var(--muted); } .lu dd { margin: 0; word-break: keep-all; }
.lu .act { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 0; }
.btn.sm { min-height: 38px; padding: 0 16px; font-size: 15px; border-radius: 20px; color: #fff !important; text-decoration: none; }
.kinds { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 14px; }
@media (min-width: 700px) {
  .cases { grid-template-columns: repeat(3, 1fr); }
  .lineup { grid-template-columns: repeat(2, 1fr); }
  .loop { grid-template-columns: repeat(2, 1fr); } .money { grid-template-columns: repeat(2, 1fr); }
  .shotrow { grid-auto-columns: 22%; }
}
.doc a.btn { color: #fff; text-decoration: none; } .doc a.btn.light { color: var(--ink); } .doc a.btn.yel { color: #2b211b; }
.doc .loop, .doc .money, .doc .grades { padding: 0; margin: 0; } .doc .grades { margin-bottom: 8px; }
.flag h3 small { color: #d9d3f5; }
.doc .lu a:not(.btn) { font-size: 13.5px; }
