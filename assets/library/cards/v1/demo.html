<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>카드 틀 v1 시안</title>
<style>
@font-face{font-family:Jua;src:url(../../ui/fonts/Jua-Regular.ttf)}
@font-face{font-family:"Gasoek One";src:url(../../ui/fonts/GasoekOne-Regular.ttf)}
body{margin:0;background:#F6EBD3;font-family:Jua,sans-serif;color:#4A3426}
section{padding:22px 26px;display:inline-block;background:#F6EBD3}
h2{margin:0 0 14px;font-weight:400;font-size:26px}
.row{display:flex;gap:22px;align-items:flex-end}
.cap{text-align:center;font-size:17px;margin-top:8px;line-height:1.3}
.cell{display:flex;flex-direction:column;align-items:center}
.stage{width:360px;height:520px;background:linear-gradient(180deg,#FFF3D6,#F3DDB0);border-radius:22px;box-shadow:0 0 0 3px #6b5443}
.film{display:flex;gap:10px}
.film .stage{transform-origin:0 0}
.fw{width:220px;height:318px;overflow:hidden;position:relative;border-radius:14px}
.fw .stage{position:absolute;left:0;top:0;transform:scale(.611);width:360px;height:520px}
.phone{width:390px;height:844px;border-radius:34px;background:#FFF3D6;box-shadow:0 0 0 6px #4A3426;position:relative;overflow:hidden}
.phone h3{margin:0;padding:50px 0 8px;text-align:center;font-weight:400;font-size:26px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 10px;padding:8px 16px}
.grid .gfc2{--w:104px}
.bar{position:absolute;left:0;right:0;bottom:0;height:64px;background:#fff8e6;box-shadow:0 -2px 0 #e8d8b8;display:flex;justify-content:space-around;align-items:center;font-size:22px}
.dim{filter:grayscale(1) opacity(.35)}
.tab{display:flex;gap:8px;padding:0 16px 8px}.tab b{font-weight:400;background:#EADFC8;border-radius:16px;padding:6px 14px;font-size:18px}.tab b.on{background:#F2B91E}
.big{display:flex;justify-content:center;padding-top:12px}
</style>
<link rel="stylesheet" href="gfcard.css">
<body>
<script src="gfcard_art.js"></script><script src="gfcard.js"></script>
<script>
const P='../../costumes/', CH=(n)=>P+n+'/good.png', SH='../../costumes/nemo_dad/joy.png';
const FAM=[['nemo_dad','네모 아빠'],['wife','세모 엄마'],['nemo_kids','네모 아이'],['nemo_mom','네모 엄마'],['nemo_grandma','네모 할머니']];
const E=(s)=>document.body.insertAdjacentHTML('beforeend',s);
const C=(o,cap)=>`<div class="cell">${GFCard.html(o)}<div class="cap">${cap||''}</div></div>`;
const G=['B','A','S','SS','SSS'], GN=['보통 · 나무','귀한 · 구리','특별 · 은','전설 · 금','신화 · 무지개'];
// 1 등급 틀 5종
E(`<section id="frames"><h2>① 등급 틀 5종 (3:4)</h2><div class="row">${G.map((g,i)=>C({g,w:178,art:(FAM[i][0]=='nemo_kids'?'../../costumes/nemo_kids/kid1.png':CH(FAM[i][0])),name:FAM[i][1]},g+' '+GN[i])).join('')}</div></section><br>`);
// 2 유아판
E(`<section id="kids"><h2>④ 유아판 (글자 없음 · 별 개수)</h2><div class="row">${G.map((g,i)=>C({g,w:178,kids:true,art:(FAM[i][0]=='nemo_kids'?'../../costumes/nemo_kids/kid1.png':CH(FAM[i][0]))},'별 '+(i+1)+'개')).join('')}</div></section><br>`);
// 3 재료
const A=GFCardArt, MAT=[['kongtteok','콩떡','소'],['kkultteok','꿀떡','중'],['mujigae','무지개떡','대']];
E(`<section id="mats"><h2>② 재료 카드 · 단짝 표식 · 도깨비 방망이</h2><div class="row">${MAT.map(([k,n,s])=>C({g:'B',w:150,art:A[k],name:n+' ('+s+')'},'크기 '+s)).join('')}
${C({g:'A',w:150,art:A.pair,name:'단짝 카드'},'단짝 표식')}
${[['fire','불'],['water','물'],['grass','풀']].map(([k,n],i)=>C({g:['A','S','SS'][i],w:150,art:A['club_'+k],name:n+' 방망이'},n+' 방망이')).join('')}</div>
<div class="row" style="margin-top:20px">${MAT.map(([k,n,s],i)=>C({g:'B',w:100,kids:true,art:A[k]},'유아 '+n)).join('')}${C({g:'A',w:100,kids:true,art:A.pair},'유아 단짝')}${['fire','water','grass'].map((k)=>C({g:'S',w:100,kids:true,art:A['club_'+k]},'유아 방망이')).join('')}</div></section><br>`);
// 4 연출 필름
const T={flip:[0,.35,.8,1.1,1.5,2.0],feed:[0,.5,.9,1.4,1.9,2.3],evolve:[0,.45,.78,.95,1.4,2.3]};
const LBL={flip:'카드 뒤집기 (뽑기) 2.2초',feed:'떡 → 동료 카드 · 경험치 2.3초',evolve:'SSS 「뚝딱!」 변신 2.4초'};
const OPT={flip:{g:'SS',name:'세모 엄마',art:CH('wife')},feed:{from:'SS',name:'네모 아빠',art:CH('nemo_dad')},evolve:{from:'SS',to:'SSS',name:'세모 엄마',art:CH('wife')}};
for(const k in T){E(`<section id="film_${k}"><h2>③ ${LBL[k]}</h2><div class="film">${T[k].map((t,i)=>`<div class="cell"><div class="fw"><div class="stage" id="f_${k}_${i}"></div></div><div class="cap">${t.toFixed(2)}s</div></div>`).join('')}</div></section><br>`);}
window.buildFilms=()=>{for(const k in T)T[k].forEach((t,i)=>GFCard.still(document.getElementById(`f_${k}_${i}`),k,OPT[k],t));};
// 5 목업
const names=['네모 아빠','세모 엄마','네모 아이','네모 엄마','네모 할머니','콩떡','꿀떡','무지개떡','단짝'];
const grid=(kids)=>{const arts=[CH('nemo_dad'),CH('wife'),'../../costumes/nemo_kids/kid1.png',CH('nemo_mom'),CH('nemo_grandma'),A.kongtteok,A.kkultteok,A.mujigae,A.pair];
 const gs=['SSS','SS','S','A','B','B','A','S','SS'];
 return arts.map((a,i)=>{const h=GFCard.html({g:gs[i],art:a,name:names[i],kids,w:104});return (i==4||i==8)&&!kids?`<div class="dim">${h}</div>`:h}).join('');};
E(`<section id="mock"><h2>실제 화면에 얹은 목업 (390×844)</h2><div class="row" style="align-items:flex-start">
<div class="phone"><h3>우리 앨범 · 가족 12/18</h3><div class="tab"><b class="on">전체</b><b>가족</b><b>옛이야기</b></div><div class="grid">${grid(false)}</div><div class="bar"><span>🏠</span><span>📖</span><span>🎴</span><span>⚙️</span></div></div>
<div class="phone"><h3 style="font-size:28px">내 책</h3><div class="tab"><b class="on">⭐ 모두</b></div><div class="grid" style="gap:18px 12px">${grid(true).replace(/--w:104px/g,'--w:104px')}</div><div class="bar"><span>🏠</span><span>📖</span><span>🎴</span></div></div>
<div class="phone"><h3>동료 키우기</h3><div id="mockfeed" class="stage" style="width:390px;height:480px;background:#FFF3D6;border-radius:0;box-shadow:none"></div><div class="big" style="gap:10px;margin-top:6px">${[['kongtteok','소'],['kkultteok','중'],['mujigae','대']].map(([k,s])=>GFCard.html({g:'B',w:84,art:A[k],name:s})).join('')}</div><div class="bar"><span>🏠</span><span>⚔️</span><span>🎴</span><span>⚙️</span></div></div>
</div></section>`);
window.buildMock=()=>{GFCard.still(document.getElementById('mockfeed'),'feed',OPT.feed,1.5);};
</script>
</body></html>
