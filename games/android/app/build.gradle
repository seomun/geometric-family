plugins {
    id 'com.android.application'
}

// 출시 서명: 키는 저장소 밖에 둔다. 사용자 홈의 ~/.gradle/gradle.properties 에 아래 4줄을 적으면 release 가 서명된다
//   GF_STORE_FILE=C:/keys/geometric-family-release.jks
//   GF_STORE_PASSWORD=...   GF_KEY_ALIAS=gfplay   GF_KEY_PASSWORD=...
// (없으면 서명 안 된 release 가 만들어진다 — 스토어에는 올릴 수 없음)
def gfStore = project.findProperty('GF_STORE_FILE')

android {
    namespace 'com.geometricfamily.play'
    compileSdk 36

    defaultConfig {
        minSdk 24
        targetSdk 35          // Galaxy Store 요구는 33 이상. 구글 플레이를 겸하면 36 으로 올린다
        versionCode 7
        versionName '1.0.0-rc6.1'
    }
    if (gfStore) {
        signingConfigs {
            release {
                storeFile file(gfStore)
                storePassword project.findProperty('GF_STORE_PASSWORD')
                keyAlias project.findProperty('GF_KEY_ALIAS')
                keyPassword project.findProperty('GF_KEY_PASSWORD')
            }
        }
    }
    // 다섯 앱 = 다섯 flavor. 같은 서명 키로 서명해야 ShareStore(집 공유)가 서로 읽는다. 각 flavor 의 HTML 은 src/<flavor>/assets/index.html
    // (games/tools/build_apk.py 가 만든다). 유아 그룹: toddler·color / 성인 그룹: tables·merge·quiz (D12)
    flavorDimensions 'app'
    productFlavors {
        toddler { dimension 'app'; applicationId 'com.geometricfamily.play';   resValue 'string', 'app_name', '기하학 가족 놀이터' }
        color   { dimension 'app'; applicationId 'com.geometricfamily.color';  resValue 'string', 'app_name', '기하학 가족: 막둥이 색칠북' }
        tables  { dimension 'app'; applicationId 'com.geometricfamily.tables'; resValue 'string', 'app_name', '기하학 가족: 세 가족 식탁' }
        merge   { dimension 'app'; applicationId 'com.geometricfamily.merge';  resValue 'string', 'app_name', '기하학 가족: 도형 합치기' }
        quiz    { dimension 'app'; applicationId 'com.geometricfamily.quiz';   resValue 'string', 'app_name', '기하학 가족: 당신은 어느 도형?' }
        block   { dimension 'app'; applicationId 'com.geometricfamily.block';  resValue 'string', 'app_name', '기하학 가족: 도형 블록' }
        spot    { dimension 'app'; applicationId 'com.geometricfamily.spot';   resValue 'string', 'app_name', '기하학 가족: 다른 그림 찾기' }
        tile    { dimension 'app'; applicationId 'com.geometricfamily.tile';   resValue 'string', 'app_name', '기하학 가족: 세 가족 짝 맞추기' }
        // `sort` 는 Groovy 컨테이너의 내장 메서드 이름이라 create() 로 만든다
        create('sort') { dimension 'app'; applicationId 'com.geometricfamily.sort'; resValue 'string', 'app_name', '기하학 가족: 정리의 달인' }
        day     { dimension 'app'; applicationId 'com.geometricfamily.day';    resValue 'string', 'app_name', '기하학 가족: 막둥이의 하루' }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (gfStore) signingConfig signingConfigs.release
        }
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    // 코드는 Java(네이티브 라이브러리 없음) → 64비트 요구도 자동 충족
}

// ---- 광고(D19, games/16_ADS_RND.md §D19): AdMob. 실제 ID 는 ~/.gradle/gradle.properties 에서 flavor 별로 주입(없으면 구글 공식 테스트 ID).
//   GF_ADMOB_APP_<FLAVOR>=ca-app-pub-…~…   GF_ADMOB_BANNER_<FLAVOR>=ca-app-pub-…/…   GF_ADMOB_INTERSTITIAL_<FLAVOR>=…   GF_ADMOB_REWARDED_<FLAVOR>=…
//   <FLAVOR> = TODDLER COLOR TABLES MERGE QUIZ BLOCK SPOT TILE SORT DAY.  유아(Families) flavor: toddler·color·day — 배너만, 아동 대상 처리, AD_ID 권한 제거.
def GF_KIDS = ['toddler', 'color', 'day']
def GF_TEST = [app: 'ca-app-pub-3940256099942544~3347511713', banner: 'ca-app-pub-3940256099942544/9214589741', interstitial: 'ca-app-pub-3940256099942544/1033173712', rewarded: 'ca-app-pub-3940256099942544/5224354917']
android.productFlavors.configureEach { f ->
    def u = f.name.toUpperCase()
    def idOf = { String k -> (project.findProperty("GF_ADMOB_${k.toUpperCase()}_${u}") ?: GF_TEST[k]) as String }
    f.manifestPlaceholders = [admobAppId: idOf('app')]
    f.buildConfigField 'boolean', 'GF_KID', GF_KIDS.contains(f.name) ? 'true' : 'false'
    f.buildConfigField 'String', 'GF_AD_BANNER', "\"${idOf('banner')}\""
    f.buildConfigField 'String', 'GF_AD_INTERSTITIAL', "\"${idOf('interstitial')}\""
    f.buildConfigField 'String', 'GF_AD_REWARDED', "\"${idOf('rewarded')}\""
    f.buildConfigField 'boolean', 'GF_AD_TEST', (project.findProperty("GF_ADMOB_APP_${u}") ? 'false' : 'true')
}
dependencies {
    implementation 'com.google.android.gms:play-services-ads:24.4.0'
    implementation 'com.google.android.ump:user-messaging-platform:3.2.0'
}
