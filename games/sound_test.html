<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>소리 검수 — 기하학 가족 놀이터</title>
<style>
body{font-family:"Malgun Gothic",sans-serif;background:#FFF6E5;color:#3A2E39;max-width:640px;margin:0 auto;padding:16px}
h1{font-size:20px} h2{font-size:16px;margin:22px 0 4px} p{font-size:14px;color:#6b5f70;line-height:1.5}
.row{display:flex;align-items:center;gap:10px;background:#fff;border-radius:14px;padding:10px 12px;margin:8px 0;box-shadow:0 2px 0 rgba(0,0,0,.1)}
.row b{flex:0 0 118px;font-size:14px} .row span{flex:1;font-size:12.5px;color:#6b5f70}
.row.off{opacity:.5}
button{border:0;border-radius:12px;background:#6CCB8A;color:#fff;font-size:16px;padding:10px 18px}
button:disabled{background:#c9c0cf}
</style></head><body>
<h1>소리 검수</h1>
<p><code>data/sounds.json</code> 의 자리(슬롯)를 그대로 읽어 전부 들려줍니다. 파일을 바꾸거나 <code>file</code> 을 새로 적으면 이 페이지에도 바로 반영됩니다. 파일이 비어 있으면(회색) 아직 없는 자리입니다. 로컬 서버 필요: <code>python -m http.server 8765</code> (저장소 루트).</p>
<div id="root">불러오는 중…</div>
<script>
fetch('../data/sounds.json').then(r=>r.json()).then(S=>{
  const root=document.getElementById('root'); root.innerHTML='';
  const add=(title,obj,pre)=>{
    const h=document.createElement('h2'); h.textContent=title; root.appendChild(h);
    Object.entries(obj).forEach(([id,e])=>{
      const r=document.createElement('div'); r.className='row'+(e.file?'':' off');
      const note=(e.desc||e.text||'')+(e.fallback&&!e.file?'  (비어 있음 → '+e.fallback+' 로 대체)':'')+(e.file?'  · '+e.file+' · vol '+(e.vol??1):'');
      r.innerHTML='<b>'+id+'</b><span>'+note+'</span><button '+(e.file?'':'disabled')+'>▶</button>';
      if(e.file){const a=new Audio(pre+e.file); if(e.loop) a.loop=true; a.volume=Math.min(1,e.vol??1);
        const btn=r.querySelector('button'); btn.onclick=()=>{ if(!a.paused){a.pause();a.currentTime=0;btn.textContent='▶';return;} a.currentTime=0;a.play();btn.textContent='■'; a.onended=()=>btn.textContent='▶'; };}
      root.appendChild(r);
    });
  };
  add('효과음',S.sfx,''); add('음악',S.music,''); add('그림책 음성 (작가 녹음)',S.voice,'');
});
</script></body></html>
