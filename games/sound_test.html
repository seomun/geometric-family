<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>소리 검수 — 기하학 가족 놀이터</title>
<style>
body{font-family:"Malgun Gothic",sans-serif;background:#FFF6E5;color:#3A2E39;max-width:560px;margin:0 auto;padding:16px}
h1{font-size:20px} p{font-size:14px;color:#6b5f70;line-height:1.5}
.row{display:flex;align-items:center;gap:10px;background:#fff;border-radius:14px;padding:10px 12px;margin:8px 0;box-shadow:0 2px 0 rgba(0,0,0,.1)}
.row b{flex:0 0 92px} .row span{flex:1;font-size:13px;color:#6b5f70}
button{border:0;border-radius:12px;background:#6CCB8A;color:#fff;font-size:16px;padding:10px 18px}
audio{width:100%}
</style></head><body>
<h1>소리 검수</h1>
<p>효과음 9종과 BGM 1곡입니다. 전부 <code>tools/make_audio.py</code> 로 직접 합성한 자작음입니다(라이선스: <code>SOUND_CREDITS.md</code>). 재생 버튼을 눌러 들어 보세요.<br>
기준: 유아 앱 상위권의 부드럽고 따뜻한 소리. 거슬리는 소리는 이름과 이유를 알려 주세요.</p>
<div id="list"></div>
<div class="row" style="display:block"><b>BGM (49초 루프)</b><br><audio controls loop src="audio/bgm.wav"></audio></div>
<script>
const S=[['tap','탭','버튼·카드 터치'],['pick','집기','캐릭터를 손으로 집을 때'],['drop','놓기','손을 뗄 때(맞든 틀리든)'],['ok','정답','제 자리에 쏙 들어갈 때'],['celebrate','축하','라운드 클리어'],['hmm','갸웃','오답 — 부드러운 안내음'],['flip','카드 뒤집기','2장 같은 얼굴'],['star','별','별 획득'],['page','쪽 넘김','그림책']];
const l=document.getElementById('list');
S.forEach(([k,n,d])=>{const r=document.createElement('div');r.className='row';r.innerHTML='<b>'+n+'</b><span>'+d+'</span><button>▶</button>';
 const a=new Audio('audio/'+k+'.wav');r.querySelector('button').onclick=()=>{a.currentTime=0;a.play()};l.appendChild(r)});
</script></body></html>
