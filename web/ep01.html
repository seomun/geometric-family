<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>기하학 가족 2화 「부고」</title>
<meta name="description" content="연락이 없던 세 동창에게 같은 문자가 왔다. — 네모·세모·동그라미, 당신은 어느 도형인가요?">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Jua&display=swap" rel="stylesheet">
<style>
  :root { --ink: #2b2118; --paper: #fff5df; }
  body { margin: 0; background: #f1e6cf; color: var(--ink); font-family: 'Jua', sans-serif; }
  .strip { max-width: 720px; margin: 0 auto; background: var(--paper); box-shadow: 0 0 40px rgba(0,0,0,.12); }
  .cut { display: block; width: 100%; height: auto; }
  .gap { height: 20px; } .gap.big { height: 60px; }
  .next { max-width: 720px; margin: 0 auto; padding: 28px 24px 40px; font-size: 22px; text-align: center; }
  .next a { color: inherit; }
  .talk { max-width: 720px; margin: 0 auto 30px; padding: 24px; text-align: center; font-size: 20px; }
  .talk a { display: inline-block; margin-top: 10px; padding: 14px 22px; border: 4px solid var(--ink); border-radius: 40px; background: #03c75a; color: #fff; text-decoration: none; font-size: 22px; box-shadow: 6px 7px 0 var(--ink); }
  .foot { text-align: center; font-size: 13px; opacity: .6; padding: 20px; font-family: sans-serif; }
</style>
</head>
<body>
<div class="strip" id="strip"></div>
<div class="talk">댓글은 네이버 블로그에서 나눠요. 당신의 이야기를 들려주세요.<br>
  <a href="https://blog.naver.com/gihahakf">기하학 가족 블로그에서 댓글 남기기 →</a></div>
<div class="next"><a href="ep02.html">← 1화 「단톡방」</a> &nbsp;·&nbsp; <a href="index.html">목차</a><br><span style="font-size:17px;opacity:.7">다음 화 — 3화 「상갓집」 준비 중</span></div>
<div class="foot">© 기하학 가족 · 이야기는 모두 허구입니다. 이름·기관은 만든 것입니다. 상처가 되었다면 미안합니다 — 연락 주시면 내리거나 고치겠습니다.</div>

<script src="../src/characters.js"></script>
<script src="shorts/_shorts.js"></script>
<script>
// 2화 「부고」 v2 (2026-10-06) — 화풍 v2. 원고: docs/01_STORY_SOURCE.md 「에피소드 1화 — 부고」(원문 보존). 고인 = 김태섭(확정)
document.body.insertAdjacentHTML('afterbegin', ROUGH_DEFS + CHAR_STYLE + SH.DEFS);
GF.setMode('clean');
GF.setAssets('../assets/');
const W = 720, { C, INK2, HEAD, sticker, hl } = SH;
const T = (x, y, t, size = 36, o = {}) => SH.T(x, y, t, size, o);
const cuts = [];
const cut = (h, inner, bg = C.cream) => cuts.push(`<svg class="cut" viewBox="0 0 ${W} ${h}" xmlns="http://www.w3.org/2000/svg"><rect width="${W}" height="${h}" fill="${bg}"/>${inner}</svg>`);
const gap = (big) => cuts.push(`<div class="gap${big ? ' big' : ''}"></div>`);
// 해설 상자
const say = (y, lines, size = 38, bg = '#fff') => { const lh = size * 1.32, h = lines.length * lh + 34, w = W - 80;
  return `<rect x="40" y="${y}" width="${w}" height="${h}" rx="22" fill="${bg}" stroke="${INK2}" stroke-width="5"/>` +
    lines.map((t, i) => T(W / 2, y + 17 + lh * (i + 0.74), t, size)).join(''); };
// 카톡 말풍선
const chat = (x, y, lines, mine = false, name = '', fs = 32) => { const lh = fs * 1.35;
  const w = Math.max(...lines.map(l => l.length)) * fs * 0.92 + 40, h = lines.length * lh + 24; let g = '';
  const bx = mine ? x - w : x;
  if (name) g += T(mine ? x : x + 4, y - 12, name, 26, { anchor: mine ? 'end' : 'start' });
  g += `<rect x="${bx}" y="${y}" width="${w}" height="${h}" rx="18" fill="${mine ? '#ffe066' : '#fff'}" stroke="${INK2}" stroke-width="4"/>`;
  lines.forEach((l, i) => { g += T(bx + 20, y + 12 + lh * (i + 0.72), l, fs, { anchor: 'start' }); });
  return g; };
const phone = (x, y, w, h, screen = '#a9c6de') => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="36" fill="#2b2b30" stroke="${INK2}" stroke-width="5"/><rect x="${x + 16}" y="${y + 34}" width="${w - 32}" height="${h - 68}" rx="18" fill="${screen}"/><circle cx="${x + w / 2}" cy="${y + 18}" r="6" fill="#666"/>`;
// 말풍선(대사) — _shorts.js say
const talk = (cx, cy, w, h, lines, size, tx, ty) => SH.say(cx, cy, w, h, lines, size, tx, ty);
// 창가 — 하늘 + 창틀 + 바깥 풍경
const windowScene = (sky, outside) => `<rect x="60" y="40" width="600" height="420" rx="10" fill="${sky}" stroke="${INK2}" stroke-width="8"/>${outside}<path d="M360,40 v420 M60,250 h600" stroke="${INK2}" stroke-width="8"/>`;
const env = (cx, cy, w, label) => { const h = w * 0.64;
  return `<g transform="translate(${cx},${cy})"><rect x="${-w / 2}" y="${-h / 2}" width="${w}" height="${h}" rx="8" fill="#fff" stroke="${INK2}" stroke-width="6"/><path d="M${-w / 2},${-h / 2} L0,${h * 0.05} L${w / 2},${-h / 2}" fill="none" stroke="${INK2}" stroke-width="5"/>${T(0, h * 0.34, label, w * 0.2, { font: HEAD })}</g>`; };

// ── 타이틀 ──
cut(620, `
  ${T(W / 2, 90, '기하학 가족', 40, { font: HEAD, extra: 'letter-spacing="10"' })}
  ${T(W / 2, 175, '2화', 50, { font: HEAD })}
  ${hl(W / 2, 265, 380, 120, '#fff', -3)}
  ${T(W / 2, 305, '부고', 120, { font: HEAD })}
  ${sticker(nemoDad({ x: 60, y: 390, w: 170, h: 150, emo: 'worry' }))}
  ${sticker(semoHusband({ x: 275, y: 375, size: 170, emo: 'bad' }))}
  ${sticker(dongDad({ cx: 590, cy: 470, r: 82, emo: 'good', item: 'phone' }))}
`, '#dcd8d2');
gap();

// ── 1 : 부고 문자 ──
cut(1000, `
  ${phone(110, 40, 500, 640, '#d5dade')}
  ${T(W / 2, 120, '＜ 메시지', 30)}
  ${chat(150, 170, ['[부고]', '김태섭 (본인상)', '상주: 김두돌, 김한돌', '장소: 구로 ○○병원', '장례식장 203호', '발인: 5월 29일'], false, '', 34)}
  ${T(W / 2, 640, '오후 2:17', 26, { fill: '#6b6b6b' })}
  ${say(730, ['그동안 연락이 없던 세 동창에게,', '같은 문자가 왔다.'], 42)}
`, '#dcd8d2');
gap();

// ── 2 : 몇 달 전 카톡 ──
cut(900, `
  ${T(W / 2, 80, '— 몇 달 전 —', 44, { font: HEAD })}
  ${chat(40, 170, ['야 그 교련샘 기억나냐 ㅋㅋ', '이름도 기억 안 난다', '매일 술 먹고 수업 들어왔잖아'], false, '태섭')}
  ${chat(680, 400, ['ㅇㅇ ㅋㅋ 그랬지'], true)}
  ${chat(40, 520, ['그때 우리 진짜 미쳤었는데'], false, '태섭')}
  ${chat(680, 640, ['ㅋㅋㅋ'], true)}
  ${T(W / 2, 820, '· · ·', 56, { fill: '#5a6a78' })}
`, C.sky);
gap();

// ── 3 : 위암 말기 ──
cut(820, `
  ${chat(40, 60, ['세모야, 나 위암 말기래.', '수술도 어렵고,', '많이 살면 6개월이란다.', '너도 검진 자주 받고,', '건강 챙겨라…', '다 부질없다.'], false, '태섭', 38)}
  ${say(560, ['맞장구는 쳐 줬다.', '셋 다, 딱히 관심은 없었다.'], 40)}
`, C.sky);
gap(true);

// ── 4~6 : 세 개의 창가 ──
cut(720, `
  ${windowScene('#cfe3f4', [0, 1, 2, 3, 4].map(i => `<rect x="${90 + i * 115}" y="${120 + (i % 2) * 30}" width="70" height="330" fill="#9aa8b6"/>`).join(''))}
  ${sticker(nemoDad({ x: 230, y: 290, w: 260, h: 230, emo: 'worry', item: 'coffee' }))}
  ${say(560, ['네모 — 아주 큰 회사 건물 창가,', '믹스커피'], 38)}
`, C.peach);
cut(720, `
  ${windowScene('#dbe9f5', `<rect x="68" y="300" width="584" height="150" fill="#9fc48a"/><circle cx="160" cy="300" r="60" fill="#7fae6a"/><circle cx="560" cy="310" r="45" fill="#7fae6a"/>`)}
  ${sticker(semoHusband({ x: 240, y: 260, size: 250, emo: 'sad', item: 'americano' }))}
  ${say(560, ['세모 — 작은 마당이 있는 IT 사무실,', '아메리카노'], 38)}
`, C.sky);
cut(720, `
  ${windowScene('#cfe3f4', `<rect x="68" y="330" width="584" height="120" fill="#c9b99a"/><path d="M120,330 v-110 h90 v110 M320,330 v-80 h110 v80 M500,330 v-130 h90 v130" fill="#e8dcc4" stroke="${INK2}" stroke-width="4"/>`)}
  ${sticker(dongDad({ cx: 360, cy: 400, r: 120, emo: 'good' }))}
  ${say(560, ['동그라미 — 교정의 창가,', '멀리 본다'], 38)}
`, '#e4e8ee');
cut(300, `${say(40, ['셋은 모두 창가에 선다. 먼 곳을 본다.', '어떤 외로움과 추억이', '함께 묻어난다.'], 40)}`);
gap();

// ── 7 : 단톡방에 불이 난다 ──
cut(1000, `
  ${T(W / 2, 80, '거의 울리지 않던 단체 카톡방', 38, { font: HEAD })}
  ${chat(40, 170, ['다들 들었냐'], false, '동창')}
  ${chat(680, 290, ['내일 7시 구로 어때'], true)}
  ${chat(40, 410, ['ㅇㅇ 갈게'], false, '동창')}
  ${chat(680, 530, ['누구누구 옴? 명단 좀'], true)}
  ${chat(40, 650, ['나 늦을 듯 8시'], false, '동창')}
  ${T(W / 2, 860, '💬 47', 64, { font: HEAD })}
`, '#e4e8ee');
cut(360, `${say(40, ['사실 셋 모두 그의 결혼식엔', '가지 않았다.', '둘은 연락을 못 받았고, 하나는', '소식을 들었지만 그냥 넘겼다.'], 38)}`);
gap(true);

// ── 8 : 다음날, 검은 정장 ──
cut(820, `
  ${T(W / 2, 90, '다음날', 60, { font: HEAD })}
  ${sticker(nemoDad({ x: 40, y: 150, w: 200, h: 177, emo: 'tired', suit: true }))}
  ${sticker(semoHusband({ x: 255, y: 140, size: 200, emo: 'bad', suit: true }))}
  ${sticker(dongDad({ cx: 590, cy: 255, r: 95, emo: 'good', suit: true }))}
  ${say(440, ['이놈저놈이 떠오른다. 삼겹살집 동창회.', '"진짜 오랜만에 보는구나"', '— 아, 이런 일 말고 볼걸.'], 36)}
  ${say(680, ['가기 싫다. 네모는 길게 한숨을 쉰다.'], 36)}
`, '#ece3d3');
gap();

// ── 9 : 전철역 ──
cut(1000, `
  <rect x="0" y="800" width="${W}" height="18" fill="#9aa3ad"/><rect x="60" y="50" width="600" height="80" rx="10" fill="#2f6f4f"/>${T(W / 2, 108, '구로디지털단지', 46, { font: HEAD, fill: '#fff' })}
  ${sticker(nemoDad({ x: 70, y: 560, w: 210, h: 185, emo: 'relief', suit: true }))}
  ${sticker(semoHusband({ x: 430, y: 545, size: 210, emo: 'good', suit: true }))}
  ${talk(230, 250, 420, 140, ['어어 왔어? 우리 생각보다', '가까운 데서 근무했구나!'], 32, 170, 560)}
  ${talk(490, 430, 420, 140, ['그러게. 이럴 줄 알았으면', '중간에 소주라도 할걸.'], 32, 540, 545)}
  ${talk(360, 900, 560, 130, ['넌 좀 친하지 않았냐?'], 40, 520, 800)}
`, C.peach);
cut(560, `
  ${talk(W / 2, 140, 640, 200, ['나? 이놈저놈 어울린 놈이 한둘이냐…', '졸업하고는 거의 연락 없었지 뭐.'], 34, 180, 400)}
  ${sticker(nemoDad({ x: 80, y: 300, w: 200, h: 177, emo: 'worry', suit: true }))}
`, C.peach);
cut(420, `${say(40, ['누가 누구랑 더 친한지는', '말하지 않아도 정해져 있었다.', '그럼 죽은 친구랑 제일 친한 건', '누구였을까. 셋은 아마 답을 모른다.'], 36)}`);
gap();

// ── 10 : 장례식장 앞 ──
cut(900, `
  <rect x="120" y="40" width="480" height="300" fill="#ddd3c2" stroke="${INK2}" stroke-width="6"/>
  <rect x="300" y="180" width="120" height="160" fill="#b9ad9b" stroke="${INK2}" stroke-width="6"/>
  ${T(W / 2, 120, '장례식장 203호', 44, { font: HEAD })}
  ${sticker(dongDad({ cx: W / 2, cy: 520, r: 120, emo: 'good', suit: true }))}
  ${talk(W / 2, 760, 520, 130, ['별일 없지? 들어가자.'], 44, 400, 660)}
`, '#e4e8ee');
cut(320, `${say(40, ['이놈 멋지다. 나이 들어도 그냥 멋지다.', '동그라미는 언제나', '군더더기가 없다.'], 38)}`);
gap();

// ── 11 : 봉투 ──
cut(900, `
  <rect x="80" y="50" width="560" height="110" rx="10" fill="#fff" stroke="${INK2}" stroke-width="6"/>${T(W / 2, 125, '부의 (賻儀)', 52, { font: HEAD })}
  ${sticker(nemoDad({ x: 40, y: 260, w: 190, h: 168, emo: 'worry', suit: true }))}
  ${sticker(semoHusband({ x: 260, y: 250, size: 190, emo: 'worry', suit: true }))}
  ${sticker(dongDad({ cx: 600, cy: 360, r: 85, emo: 'good', suit: true }))}
  ${env(135, 520, 150, '네모')}${env(355, 520, 150, '세모')}
  ${T(600, 600, '(미리 준비해 왔다)', 30)}
  ${say(660, ['얼마나 해야 하나. 종일 고민했다.', '서로 묻진 못했다.'], 40)}
`);
gap();

// ── 12 : 넌 얼마나 했냐 ──
cut(820, `
  ${talk(260, 120, 420, 130, ['넌 얼마나 했냐?'], 48, 200, 300)}
  ${talk(470, 640, 460, 130, ['뭐, 그런 거 알아 뭐하게.'], 40, 560, 500)}
  ${sticker(semoHusband({ x: 80, y: 300, size: 220, emo: 'bad', suit: true }))}
  ${sticker(dongDad({ cx: 560, cy: 400, r: 100, emo: 'good', suit: true }))}
`);
gap(true);

// ── 13 : 착지 ──
cut(620, `
  ${T(W / 2, 140, '금액이 뭔 상관이냐고', 46)}
  ${T(W / 2, 210, '묻는 듯하다.', 46)}
  ${sticker(nemoDad({ x: 255, y: 250, w: 210, h: 185, emo: 'sad', suit: true }))}
  ${hl(W / 2, 535, 640, 110, C.hlY, -2)}
  ${T(W / 2, 560, '우린 상관이 좀 있단다, 친구야.', 46, { font: HEAD })}
`, '#ece3d3');
gap(true);

// ── 끝 : 당신은 어느 도형인가요? ──
cut(1000, `
  ${T(W / 2, 110, '같은 부고를 받았다면', 50, { font: HEAD })}
  ${hl(W / 2, 200, 560, 110, C.hlY, -2)}
  ${T(W / 2, 230, '어느 도형인가요?', 64, { font: HEAD })}
  ${sticker(nemoDad({ x: 50, y: 330, w: 180, h: 159, emo: 'worry', suit: true }))}
  ${sticker(semoHusband({ x: 270, y: 320, size: 180, emo: 'bad', suit: true }))}
  ${sticker(dongDad({ cx: 590, cy: 410, r: 90, emo: 'good', suit: true }))}
  ${SH.pill(W / 2, 640, '① 네모 — 종일 고민한다', 38)}
  ${SH.pill(W / 2, 750, '② 세모 — 대놓고 물어본다', 38)}
  ${SH.pill(W / 2, 860, '③ 동그라미 — 미리 준비한다', 38)}
`, C.mint);

document.getElementById('strip').innerHTML = cuts.join('');
</script>
</body>
</html>
