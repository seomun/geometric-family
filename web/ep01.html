<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>기하학 가족 2화 「부고」</title>
<meta name="description" content="같은 부고 문자를 받은 세 동창. 네모·세모·동그라미 — 당신은 어느 도형인가요?">
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Gowun+Dodum&family=Nanum+Myeongjo&display=swap" rel="stylesheet">
<style>
  :root { --ink: #4a3626; --paper: #f4ecdd; }
  body { margin: 0; background: #e9dfcc; color: var(--ink); font-family: 'Gowun Dodum', sans-serif; }
  .strip { max-width: 720px; margin: 0 auto; background: var(--paper); box-shadow: 0 0 40px rgba(0,0,0,.15); }
  .cut { display: block; width: 100%; height: auto; }
  .gap { height: 28px; }
  .gap.big { height: 90px; }
  .cta { padding: 36px 24px 60px; text-align: center; }
  .cta h2 { font-family: Gaegu, sans-serif; font-size: 32px; margin: 0 0 6px; }
  .cta p { margin: 6px 0 18px; font-size: 17px; line-height: 1.6; }
  .votes { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .vote { flex: 1 1 150px; max-width: 200px; border: 3px solid var(--ink); background: #fff; border-radius: 16px; padding: 14px 10px; cursor: pointer; font-family: Gaegu, sans-serif; font-size: 22px; color: var(--ink); transition: transform .1s; }
  .vote:active { transform: scale(.97); }
  .vote svg { width: 72px; height: 72px; display: block; margin: 0 auto 6px; }
  .vote.picked { background: #fff3d6; box-shadow: 0 0 0 3px #e2b76a; }
  .bars { margin: 18px auto 0; max-width: 420px; text-align: left; display: none; }
  .bar { margin: 8px 0; font-size: 14px; }
  .bar i { display: block; height: 14px; border-radius: 7px; background: var(--ink); margin-top: 4px; transition: width .5s; }
  .note { font-size: 15px; opacity: .8; margin-top: 14px; }
  .next { margin-top: 36px; padding-top: 20px; border-top: 2px dashed var(--ink); font-family: Gaegu, sans-serif; font-size: 20px; }
  .foot { text-align: center; font-size: 12px; opacity: .6; padding: 20px; }
</style>
</head>
<body>
<div class="strip" id="strip"></div>
<div class="foot">© 기하학 가족 · 이야기는 모두 허구입니다. 상처가 되었다면 미안합니다 — 연락 주시면 내리거나 고치겠습니다.</div>

<script src="../src/characters.js"></script>
<script>
document.body.insertAdjacentHTML('afterbegin', ROUGH_DEFS + CHAR_STYLE);
GF.setMode('hand'); // 웹툰은 손 터치 렌더 (굿즈 인쇄용은 clean)
const W = 720, F = "font-family:'Gaegu',sans-serif", FB = "font-family:'Gowun Dodum',sans-serif", FM = "font-family:'Nanum Myeongjo',serif";
const cuts = [];
const cut = (h, inner, bg) => cuts.push(`<svg class="cut" viewBox="0 0 ${W} ${h}" xmlns="http://www.w3.org/2000/svg">${bg ? `<rect width="${W}" height="${h}" fill="${bg}"/>` : ''}${inner}${paper(W, h)}</svg>`);
const gap = (big) => cuts.push(`<div class="gap${big ? ' big' : ''}"></div>`);
const T = (x, y, t, size = 26, anchor = 'middle', font = FB, extra = '') => `<text x="${x}" y="${y}" text-anchor="${anchor}" font-size="${size}" style="${font}" fill="${INK}" ${extra}>${t}</text>`;

// 카톡 말풍선 (채팅 UI)
function chat(x, y, w, lines, mine = false, name = '') {
  const lh = 32, h = lines.length * lh + 22; let g = '';
  if (name) g += T(mine ? x + w : x, y - 8, name, 18, mine ? 'end' : 'start');
  g += `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="12" fill="${mine ? '#ffe98a' : '#fff'}" stroke="${INK}" stroke-width="2"/>`;
  lines.forEach((l, i) => { g += T(x + 16, y + 16 + lh * (i + 0.62), l, 25, 'start'); });
  return g;
}
const phoneFrame = (x, y, w, h) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="26" fill="#2b2b30" stroke="${INK}" stroke-width="3"/><rect x="${x + 12}" y="${y + 26}" width="${w - 24}" height="${h - 52}" rx="12" fill="#b7c8d6"/><circle cx="${x + w / 2}" cy="${y + 15}" r="4" fill="#666"/>`;

// ---- 1. 타이틀 ----
cut(360, `
  ${T(W / 2, 70, '기하학 가족', 26, 'middle', F, 'letter-spacing="6"')}
  ${T(W / 2, 150, '2화', 30, 'middle', F)}
  ${T(W / 2, 220, '「 부고 」', 58, 'middle', FM, 'font-weight="700"')}
  ${nemoDad({ x: 150, y: 244, w: 70, h: 62, emo: 'worry', pose: 'think' })}
  ${semoHusband({ x: 320, y: 240, size: 74, emo: 'bad', pose: 'hips' })}
  ${dongDad({ cx: 540, cy: 278, r: 32, emo: 'good', pose: 'hold', item: 'phone' })}
`);
gap();
// ---- 2. 문자 ----
cut(520, `
  ${phoneFrame(200, 30, 320, 460)}
  ${T(360, 92, '＜ 메시지', 20, 'middle', FB)}
  ${chat(232, 110, 256, ['[부고]', '이창명 (본인상)', '상주: 이두돌, 이한돌', '장소: 구로고대병원', '　　　장례식장 203호', '발인: 5월 29일', '온라인 추모: ...'], false)}
  ${T(360, 440, '오후 2:17', 13, 'middle', FB, 'opacity=".6"')}
`);
cut(120, narration(90, 30, 540, ['그동안 연락이 없던 세 동창에게,', '같은 문자가 왔다.']));
gap();
// ---- 3. 몇 달 전 카톡 (회상) ----
cut(560, `
  ${T(60, 44, '— 몇 달 전 —', 22, 'start', FM, 'opacity=".8"')}
  ${chat(60, 70, 420, ['야 그 교련샘 기억나냐 ㅋㅋ', '이름도 기억 안 난다', '매일 술 먹고 수업 들어왔잖아'], false, '창명')}
  ${chat(400, 190, 200, ['ㅇㅇ ㅋㅋ 그랬지'], true)}
  ${chat(60, 260, 380, ['그때 우리 진짜 미쳤었는데'], false)}
  ${chat(460, 320, 160, ['ㅋㅋㅋ'], true)}
  ${chat(60, 390, 520, ['세모야, 나 위암 말기래.', '수술도 어렵고, 많이 살면 6개월이란다.', '너도 검진 자주 받고, 건강 챙겨라…', '다 부질없다.'], false, '창명')}
`);
cut(110, narration(90, 30, 540, ['맞장구는 쳐 줬다. 셋 다, 딱히 관심은 없었다.']));
gap(true);
// ---- 4. 세 창가 ----
function windowCut(id, who, sky1, sky2, label, warm) {
  return `<svg class="cut" viewBox="0 0 ${W} 420" xmlns="http://www.w3.org/2000/svg">${windowBg(id, sky1, sky2)}${who}${T(W / 2, 404, label, 22, 'middle', FM, 'opacity=".8"')}${paper(W, 420)}</svg>`;
}
cuts.push(windowCut('sky1', nemoDad({ x: 300, y: 250, w: 120, h: 106, emo: 'worry', gaze: 0, pose: 'hold', item: 'coffee' }) +
  `<g opacity=".35">${[0, 1, 2, 3, 4, 5].map(i => `<rect x="${110 + i * 90}" y="${60 + (i % 2) * 20}" width="40" height="120" fill="${INK}"/>`).join('')}</g>`, '#cfe3f4', '#e6eef3', '네모 — 큰 건물 회사 창가, 믹스커피', true));
cuts.push(windowCut('sky2', semoHusband({ x: 300, y: 236, size: 122, emo: 'sad', gaze: 1, pose: 'hold', item: 'americano' }) +
  `<g opacity=".5"><rect x="100" y="150" width="520" height="100" fill="#9fc48a"/><circle cx="180" cy="150" r="40" fill="#7fae6a"/><circle cx="560" cy="160" r="30" fill="#7fae6a"/></g>`, '#dbe9f5', '#f3f0dc', '세모 — IT 사무실, 작은 마당, 아메리카노', false));
cuts.push(windowCut('sky3', dongDad({ cx: 360, cy: 300, r: 52, emo: 'good', gaze: -1, pose: 'think' }) +
  `<g opacity=".45"><rect x="90" y="200" width="540" height="60" fill="#c9b99a"/><path d="M120,200 v-70 h60 v70 M300,200 v-50 h80 v50 M520,200 v-80 h60 v80" fill="#e8dcc4" stroke="${INK}" stroke-width="2"/></g>`, '#cfe3f4', '#f0e6d2', '동그라미 — 교정 창가, 멀리 본다', false));
cut(120, narration(90, 30, 540, ['셋은 모두 창가에 선다. 먼 곳을 본다.', '어떤 외로움과 추억이 함께 묻어난다.']));
gap();
// ---- 5. 단톡방에 불이 난다 ----
cut(430, `
  ${T(60, 44, '— 거의 울리지 않던 단체 카톡방 —', 22, 'start', FM, 'opacity=".8"')}
  ${chat(60, 70, 260, ['다들 들었냐'], false, '동창A')}
  ${chat(340, 110, 300, ['내일 7시 구로 어때'], false, '동창B')}
  ${chat(60, 170, 200, ['ㅇㅇ 갈게'], false, '동창C')}
  ${chat(300, 220, 340, ['누구누구 옴? 명단 좀'], false, '동창D')}
  ${chat(60, 280, 240, ['나 늦을 듯 8시'], false, '동창E')}
  ${chat(380, 330, 260, ['ㅇㅇ'], true)}
  ${T(W / 2, 412, '💬 47', 20, 'middle', FB, 'opacity=".7"')}
`);
cut(140, narration(90, 30, 540, ['사실 셋 모두 그의 결혼식엔 가지 않았다.', '둘은 연락을 못 받았고, 하나는 소식을 들었지만 그냥 넘겼다.']));
gap(true);
// ---- 6. 다음날, 검은 정장 ----
cut(300, `
  ${T(W / 2, 50, '다음날', 24, 'middle', FM)}
  ${nemoDad({ x: 120, y: 120, w: 120, h: 106, emo: 'tired', suit: true })}
  ${semoHusband({ x: 300, y: 112, size: 122, emo: 'bad', suit: true, pose: 'hips' })}
  ${dongDad({ cx: 560, cy: 176, r: 52, emo: 'good', suit: true, pose: 'hold', item: 'phone' })}
`, '#ece3d3');
cut(150, narration(90, 30, 540, ['이놈저놈이 떠오른다. 삼겹살집 동창회.', '"진짜 오랜만에 보는구나" — 아, 이런 일 말고 볼걸.', '가기 싫다. 네모는 길게 한숨을 쉰다.']));
gap();
// ---- 7. 전철역 ----
cut(520, `
  <g opacity=".35"><rect x="0" y="330" width="${W}" height="14" fill="${INK}"/><rect x="0" y="352" width="${W}" height="6" fill="${INK}"/><rect x="60" y="120" width="600" height="60" rx="6" fill="#c7b9a3"/>${T(360, 162, '구로디지털단지', 28, 'middle', FB)}</g>
  ${nemoDad({ x: 160, y: 230, w: 120, h: 106, emo: 'relief', suit: true, gaze: 1, pose: 'wave' })}
  ${semoHusband({ x: 420, y: 222, size: 122, emo: 'good', suit: true, gaze: -1, pose: 'shrug' })}
  ${speech(40, 20, 330, ['어어 왔어? 우리 생각보다', '가까운 데서 근무했구나!'], { tail: 'right' })}
  ${speech(380, 20, 310, ['그러게. 이럴 줄 알았으면', '중간에 소주라도 할걸.'], { tail: 'left' })}
  ${speech(350, 380, 340, ['넌 좀 친하지 않았냐?'], { tail: 'left' })}
  ${speech(20, 436, 470, ['나? 이놈저놈 어울린 놈이 한둘이냐…', '졸업하고는 거의 연락 없었지 뭐.'], { tail: 'right' })}
`);
cut(150, narration(90, 30, 540, ['누가 누구랑 더 친한지는 말하지 않아도 정해져 있었다.', '그럼 죽은 친구랑 제일 친한 건 누구였을까.', '셋은 아마 답을 모르고 있을 것이다.']));
gap();
// ---- 8. 장례식장 앞 ----
cut(400, `
  <g opacity=".4"><rect x="140" y="40" width="440" height="230" fill="#ddd3c2" stroke="${INK}" stroke-width="3"/><rect x="300" y="150" width="120" height="120" fill="#b9ad9b" stroke="${INK}" stroke-width="3"/>${T(360, 100, '장례식장', 26, 'middle', FM)}${T(360, 130, '203호', 18, 'middle', FB)}</g>
  ${dongDad({ cx: 360, cy: 320, r: 52, emo: 'good', suit: true, pose: 'point', gaze: 1 })}
  ${nemoDad({ x: 100, y: 268, w: 100, h: 88, emo: 'worry', suit: true, gaze: 1 })}
  ${semoHusband({ x: 520, y: 262, size: 100, emo: 'worry', suit: true, gaze: -1 })}
  ${speech(240, 190, 240, ['별일 없지? 들어가자.'], { tail: 'left' })}
`);
cut(120, narration(90, 30, 540, ['이놈 멋지다. 나이 들어도 그냥 멋지다.', '동그라미는 언제나 군더더기가 없다.']));
gap();
// ---- 9. 봉투 ----
cut(420, `
  <rect x="60" y="60" width="600" height="80" fill="#fff" stroke="${INK}" stroke-width="2"/>${T(360, 110, '부의 (賻儀)', 24, 'middle', FM)}
  ${nemoDad({ x: 120, y: 200, w: 110, h: 96, emo: 'worry', suit: true, gaze: -1, pose: 'hold', item: 'envelope' })}
  ${semoHusband({ x: 280, y: 192, size: 112, emo: 'worry', suit: true, gaze: 1, pose: 'hold', item: 'envelope' })}
  ${dongDad({ cx: 580, cy: 262, r: 50, emo: 'good', suit: true, gaze: -1 })}
  <rect x="150" y="150" width="60" height="40" fill="#fff" stroke="${INK}" stroke-width="2"/><rect x="310" y="150" width="60" height="40" fill="#fff" stroke="${INK}" stroke-width="2"/>
  ${T(180, 176, '네모', 14)}${T(340, 176, '세모', 14)}
  ${T(580, 352, '(미리 준비해 왔다)', 20, 'middle', FB, 'opacity=".8"')}
`);
cut(120, narration(90, 30, 540, ['얼마나 해야 하나. 종일 고민했다.', '서로 묻진 못했다.']));
gap();
// ---- 10. 얼마나 했냐 ----
cut(420, `
  ${semoHusband({ x: 110, y: 200, size: 112, emo: 'bad', suit: true, gaze: 1, pose: 'point' })}
  ${dongDad({ cx: 540, cy: 266, r: 50, emo: 'good', suit: true, gaze: -1, pose: 'shrug' })}
  ${nemoDad({ x: 300, y: 250, w: 96, h: 84, emo: 'worry', suit: true, gaze: 1 })}
  ${speech(60, 40, 300, ['넌 얼마나 했냐?'], { tail: 'left' })}
  ${speech(380, 100, 300, ['뭐, 그런 거 알아 뭐하게.'], { tail: 'right' })}
`);
cut(220, narration(70, 30, 580, ['금액이 뭔 상관이냐고 묻는 듯하다.', '', '우린 상관이 좀 있단다, 친구야.'], { size: 40 }));
gap(true);
// ---- 11. 엔딩 ----
cut(360, `
  ${nemoDad({ x: 110, y: 150, w: 120, h: 106, emo: 'sad', suit: true })}
  ${semoHusband({ x: 300, y: 142, size: 122, emo: 'sad', suit: true, pose: 'think' })}
  ${dongDad({ cx: 560, cy: 206, r: 52, emo: 'good', suit: true })}
  ${T(W / 2, 80, '1화 끝', 22, 'middle', F)}
`, '#ece3d3');

document.getElementById('strip').innerHTML = cuts.join('') + `
<div class="cta">
  <h2>당신은 어느 도형인가요?</h2>
  <p>같은 부고를 받았다면 — 당신은 어떻게 했을 것 같나요.</p>
  <div class="votes" id="votes">
    <button class="vote" data-k="square"><svg viewBox="0 0 80 80">${nemoDad({ x: 12, y: 8, w: 56, h: 50, emo: 'joy', pose: 'cheer' })}</svg>네모</button>
    <button class="vote" data-k="triangle"><svg viewBox="0 0 80 80">${semoHusband({ x: 12, y: 6, size: 56, emo: 'wink', pose: 'hips' })}</svg>세모</button>
    <button class="vote" data-k="circle"><svg viewBox="0 0 80 80">${dongDad({ cx: 40, cy: 34, r: 26, emo: 'good', pose: 'think' })}</svg>동그라미</button>
  </div>
  <div class="bars" id="bars"></div>
  <p class="note">댓글로 당신의 이야기를 남겨 주세요. 좋은 사연은 동의를 받아 외전으로 이어집니다.</p>
  <div class="next"><a href="ep02.html" style="color:inherit">← 1화 「단톡방」</a> &nbsp;·&nbsp; <a href="index.html" style="color:inherit">목차</a><br><span style="font-size:15px;opacity:.7">다음 화 — 3화 「집 청소」 준비 중</span></div>
</div>`;

// 투표: 서버 없음. 이 브라우저에만 저장. (배포 시 폼/댓글 서비스로 교체 지점)
const KEY = 'gf.ep01.vote', NAMES = { square: '네모', triangle: '세모', circle: '동그라미' }, BASE = { square: 38, triangle: 27, circle: 35 }; // BASE = 시드 표본(표시용)
function showBars(mine) {
  const el = document.getElementById('bars'); el.style.display = 'block';
  const tot = Object.values(BASE).reduce((a, b) => a + b, 0) + 1;
  el.innerHTML = Object.keys(NAMES).map(k => { const v = BASE[k] + (k === mine ? 1 : 0), p = Math.round(v * 100 / tot); return `<div class="bar">${NAMES[k]} ${p}%${k === mine ? ' — 당신' : ''}<i style="width:${p}%"></i></div>`; }).join('');
}
document.getElementById('votes').addEventListener('click', e => {
  const b = e.target.closest('.vote'); if (!b) return;
  try { localStorage.setItem(KEY, b.dataset.k); } catch (err) {}
  document.querySelectorAll('.vote').forEach(v => v.classList.toggle('picked', v === b)); showBars(b.dataset.k);
});
try { const m = localStorage.getItem(KEY); if (m) { document.querySelector(`.vote[data-k="${m}"]`)?.classList.add('picked'); showBars(m); } } catch (err) {}
</script>
</body>
</html>
