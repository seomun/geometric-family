<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>기하학 가족 1화 「단톡방」</title>
<meta name="description" content="말을 걸어볼까? 미룬다. 또 미룬다. — 네모·세모·동그라미, 당신은 어느 도형인가요?">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Jua&display=swap" rel="stylesheet">
<style>
  :root { --ink: #2b2118; --paper: #fff5df; }
  body { margin: 0; background: #f1e6cf; color: var(--ink); font-family: 'Jua', sans-serif; }
  .strip { max-width: 720px; margin: 0 auto; background: var(--paper); box-shadow: 0 0 40px rgba(0,0,0,.12); }
  .cut { display: block; width: 100%; height: auto; }
  .gap { height: 20px; } .gap.big { height: 60px; }
  .next { max-width: 720px; margin: 0 auto; padding: 28px 24px 40px; font-size: 22px; text-align: center; }
  .next a { color: inherit; }
  .talk { max-width: 720px; margin: 0 auto 30px; padding: 24px; text-align: center; font-size: 20px; }
  .talk a { display: inline-block; margin-top: 10px; padding: 14px 22px; border: 4px solid var(--ink); border-radius: 40px; background: #03c75a; color: #fff; text-decoration: none; font-size: 22px; box-shadow: 6px 7px 0 var(--ink); }
  .foot { text-align: center; font-size: 13px; opacity: .6; padding: 20px; font-family: sans-serif; }
</style>
</head>
<body>
<div class="strip" id="strip"></div>
<div class="talk">댓글은 네이버 블로그에서 나눠요. 당신의 이야기를 들려주세요.<br>
  <a href="https://blog.naver.com/gihahakf">기하학 가족 블로그에서 댓글 남기기 →</a></div>
<div class="next"><a href="index.html">목차</a> &nbsp;·&nbsp; <a href="ep01.html">다음 화 — 2화 「부고」 →</a></div>
<div class="foot">© 기하학 가족 · 이야기는 모두 허구입니다. 상처가 되었다면 미안합니다 — 연락 주시면 내리거나 고치겠습니다.</div>

<script src="../src/characters.js"></script>
<script src="shorts/_shorts.js"></script>
<script>
// 1화 「단톡방」 v2 (2026-10-02) — 화풍 v2(큰 글자·단색·스티커). 원고: content/blog/ep02_namo.md (원문 보존)
// 휴대폰 기준: 720폭 캔버스에서 본문 ≥ 34px (폰 화면 약 17px), 제목 ≥ 56px. 네이버 블로그용 컷은 tools/export_cuts.js
document.body.insertAdjacentHTML('afterbegin', ROUGH_DEFS + CHAR_STYLE + SH.DEFS);
GF.setMode('clean');
GF.setAssets('../assets/');
const W = 720, { C, INK2, HEAD, BODY, sticker, hl, cloud } = SH;
const T = (x, y, t, size = 36, o = {}) => SH.T(x, y, t, size, o);
const cuts = [];
const cut = (h, inner, bg = C.cream) => cuts.push(`<svg class="cut" viewBox="0 0 ${W} ${h}" xmlns="http://www.w3.org/2000/svg"><rect width="${W}" height="${h}" fill="${bg}"/>${inner}</svg>`);
const gap = (big) => cuts.push(`<div class="gap${big ? ' big' : ''}"></div>`);

// 해설 상자 — 여러 줄, 가운데
const say = (y, lines, size = 38, bg = '#fff') => { const lh = size * 1.32, h = lines.length * lh + 34, w = W - 80;
  return `<rect x="40" y="${y}" width="${w}" height="${h}" rx="22" fill="${bg}" stroke="${INK2}" stroke-width="5"/>` +
    lines.map((t, i) => T(W / 2, y + 17 + lh * (i + 0.74), t, size)).join(''); };
// 속마음 — 둥근 생각 풍선 + 꼬리 원 두 개(tx,ty 쪽으로)
const think = (y, lines, size, tx, ty) => { const lh = size * 1.3, h = lines.length * lh + 40, w = W - 100;
  return `<rect x="50" y="${y}" width="${w}" height="${h}" rx="${Math.min(h / 2, 60)}" fill="#fff" stroke="${INK2}" stroke-width="5"/>` +
    `<circle cx="${tx}" cy="${ty - 34}" r="15" fill="#fff" stroke="${INK2}" stroke-width="4"/><circle cx="${tx + 12}" cy="${ty}" r="8" fill="#fff" stroke="${INK2}" stroke-width="4"/>` +
    lines.map((t, i) => T(W / 2, y + 20 + lh * (i + 0.75), t, size, { font: HEAD })).join(''); };
// 카톡 말풍선
const chat = (x, y, lines, mine = false, name = '', fs = 32) => { const lh = fs * 1.35;
  const w = Math.max(...lines.map(l => l.length)) * fs * 0.92 + 40, h = lines.length * lh + 24; let g = '';
  const bx = mine ? x - w : x;
  if (name) g += T(mine ? x : x + 4, y - 12, name, 26, { anchor: mine ? 'end' : 'start' });
  g += `<rect x="${bx}" y="${y}" width="${w}" height="${h}" rx="18" fill="${mine ? '#ffe066' : '#fff'}" stroke="${INK2}" stroke-width="4"/>`;
  lines.forEach((l, i) => { g += T(bx + 20, y + 12 + lh * (i + 0.72), l, fs, { anchor: 'start' }); });
  return g; };
const phone = (x, y, w, h, screen = '#a9c6de') => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="36" fill="#2b2b30" stroke="${INK2}" stroke-width="5"/><rect x="${x + 16}" y="${y + 34}" width="${w - 32}" height="${h - 68}" rx="18" fill="${screen}"/><circle cx="${x + w / 2}" cy="${y + 18}" r="6" fill="#666"/>`;

// ── 타이틀 ──
cut(620, `
  ${T(W / 2, 90, '기하학 가족', 40, { font: HEAD, extra: 'letter-spacing="10"' })}
  ${T(W / 2, 175, '1화', 50, { font: HEAD })}
  ${hl(W / 2, 265, 470, 120, '#fff', -3)}
  ${T(W / 2, 305, '단톡방', 120, { font: HEAD })}
  ${sticker(nemoDad({ x: 250, y: 360, w: 220, h: 194, emo: 'worry', item: 'phone' }))}
`, C.yellow);
gap();

// ── 1 : 말을 걸어볼까? ──
cut(620, `
  ${think(50, ['말을 걸어볼까?'], 64, 400, 250)}
  ${sticker(nemoDad({ x: 220, y: 290, w: 280, h: 247, emo: 'worry', item: 'phone' }))}
`, C.peach);
gap();

// ── 2 : 한동안 참 많이도 ──
cut(1000, `
  ${say(40, ['언제였을까, 이 친구랑', '아주 한동안 참 많이도 얘기하고', '거의 맨날 카톡한 거 같은데.'], 38)}
  ${phone(110, 300, 500, 660)}
  ${chat(150, 380, ['ㅋㅋㅋㅋ'])}
  ${chat(570, 470, ['진짜?'], true)}
  ${chat(150, 560, ['야 그거 봤냐'])}
  ${chat(570, 650, ['ㅇㅇ 봤지'], true)}
  ${chat(150, 740, ['내일 볼까'])}
  ${chat(570, 830, ['ㄱㄱ'], true)}
`);
gap();

// ── 3 : 기록도 지워졌네 ──
cut(820, `
  ${phone(160, 40, 400, 540, '#e3e8ec')}
  ${T(W / 2, 320, '대화 내용이 없습니다', 32, { fill: '#8a8f94' })}
  ${say(620, ['마지막이 언제지?', '기록도 지워졌네.'], 44)}
`, C.peach);
gap();

// ── 4 : 미룬다. 또 미룬다. ──
cut(620, `
  ${['월', '수', '금'].map((d, i) => T(130 + i * 230, 90, d, 44, { font: HEAD })).join('')}
  ${sticker(nemoDad({ x: 50, y: 130, w: 160, h: 141, emo: 'worry', item: 'phone' }))}
  ${sticker(nemoDad({ x: 280, y: 130, w: 160, h: 141, emo: 'bad', item: 'phone' }))}
  ${sticker(nemoDad({ x: 510, y: 130, w: 160, h: 141, emo: 'tired', item: 'phone' }))}
  ${T(W / 2, 430, '미룬다.', 64, { font: HEAD })}
  ${hl(W / 2, 520, 360, 90, C.hlY, -2)}
  ${T(W / 2, 545, '또 미룬다.', 64, { font: HEAD })}
`);
gap(true);

// ── 5 : 보냈다 · 답이 없다 ──
cut(1080, `
  ${think(40, ['그냥 한번 말 걸어볼까?'], 50, 560, 230)}
  ${phone(110, 250, 500, 520)}
  ${chat(570, 330, ['하이루, 어케 지내?', '그동안 너무', '연락이 없었지..'], true)}
  ${T(130, 470, '1', 30, { fill: '#e04a4a', font: HEAD })}
  ${T(W / 2, 640, '· · ·', 56, { fill: '#5a6a78' })}
  ${say(810, ['답이 없다. 안 읽는다.', '괜히 말 걸었나, 에이 일이나 하자'], 36)}
`, C.sky);
gap();

// ── 6 : 띠링 ──
cut(1060, `
  ${T(W / 2, 100, '띠링!', 80, { font: HEAD, outline: 12 })}
  ${phone(80, 150, 560, 620)}
  ${chat(120, 240, ['아 쏘리 바뻐서 늦게봤다.', '어케 지내?', '나도 뭐 그냥저냥', '전과 비슷하다.', '와 우리 얼굴본지', '오래되었지?'], false, '친구')}
  ${sticker(nemoDad({ x: 470, y: 600, w: 210, h: 185, emo: 'joy' }))}
  ${hl(W / 2, 900, 600, 110, C.hlY, -2)}
  ${T(W / 2, 925, '그래, 말 걸길 잘했다.', 52, { font: HEAD })}
`, C.peach);

// ══════════ 반대편 : 세모 ══════════
gap(true);
cut(300, `
  ${T(W / 2, 120, '같은 시각, 반대편', 44)}
  ${T(W / 2, 230, '세모네', 96, { font: HEAD, outline: 12 })}
`, C.sky);
gap();

// ── S1 : 께톡깨톡 ──
cut(620, `
  ${T(W / 2, 110, '께톡깨톡', 80, { font: HEAD, outline: 12 })}
  ${sticker(semoHusband({ x: 90, y: 180, size: 240, emo: 'surprise', item: 'phone' }))}
  ${sticker(semoWife({ x: 390, y: 180, size: 240, emo: 'calm' }))}
`, C.sky);
gap();

// ── S2 : 받은 메시지 ──
cut(560, `
  ${phone(110, 40, 500, 460)}
  ${chat(150, 150, ['하이루, 어케 지내?', '그동안 너무', '연락이 없었지..'], false, '네모')}
`);
gap();

// ── S3 : 속마음 ──
cut(1060, `
  ${think(40, ['아 이제사 보내,', '그래도 항상 이놈이', '좀 챙기고 사는구나 싶다.'], 44, 360, 330)}
  ${think(370, ['정신없을 텐데,', '애가 셋이라 했었나?'], 44, 400, 560)}
  ${sticker(semoHusband({ x: 230, y: 580, size: 260, emo: 'worry' }))}
  ${say(890, ['난 왜 애도 없는데 이리 바쁜 걸까'], 38)}
`, C.sky);
gap();

// ── S4 : 답장 · 약속 ──
cut(1000, `
  ${phone(60, 30, 600, 920)}
  ${chat(620, 120, ['아 쏘리 바뻐서 늦게봤다.', '어케 지내?', '나도 뭐 그냥저냥', '전과 비슷하다.', '와 우리 얼굴본지', '오래되었지?'], true)}
  ${chat(620, 520, ['말 나온김에', '공덕서 소주나 한잔하자.', '언제가 편해?', '난 수요일 시간 괜찮아'], true)}
`);
gap();

// ── S5 : 네모의 답 ──
cut(900, `
  ${phone(80, 30, 560, 460)}
  ${chat(120, 130, ['어이쿠, 우리 유명인께서', '시간을 내주신다면야,', '나야 다 괜찮아.', '니가 바쁘지 뭐'], false, '네모')}
  ${sticker(semoHusband({ x: 250, y: 520, size: 220, emo: 'joy' }))}
  ${say(790, ['네모는 항상 오케이였던 거 같다.'], 38)}
`, C.sky);
gap();

// ── S6 : 메모 ──
cut(1000, `
  <rect x="170" y="40" width="380" height="300" rx="14" fill="#fff4a8" stroke="${INK2}" stroke-width="5" transform="rotate(-3 360 190)"/>
  ${T(W / 2, 150, '수요일 약속', 60, { font: HEAD })}
  ${T(W / 2, 230, '공덕 · 소주', 44)}
  ${T(W / 2, 300, '— 나감', 38, { fill: '#6b6b6b' })}
  ${sticker(semoHusband({ x: 70, y: 400, size: 230, emo: 'good' }))}
  ${sticker(semoWife({ x: 420, y: 400, size: 230, emo: 'good' }))}
  ${say(700, ['메모한다. 마누라에게 남겨야겠다.'], 36)}
  ${say(830, ['둘만 있다 보니', '더 밖에 나가는 일이 적다'], 36)}
`);

// ══════════ 반대편 2 : 동그라미 ══════════
gap(true);
cut(300, `
  ${T(W / 2, 120, '그리고, 같은 단톡방', 44, { fill: '#dfe6f2' })}
  ${T(W / 2, 230, '동그라미네', 96, { font: HEAD, fill: '#fff' })}
`, '#2f3a55');
gap();

// ── D1 : 부고 ──
cut(820, `
  ${phone(160, 40, 400, 520, '#d5dade')}
  ${T(W / 2, 210, '[부고]', 52, { font: HEAD })}
  ${T(W / 2, 300, '김원상, 본인상', 44)}
  ${T(W / 2, 370, '상주 …', 34, { fill: '#6b6b6b' })}
  ${say(610, ['채팅이 얼마 지나지 않아,', '본인상 부고가 뜬다.'], 40)}
`, '#dcd8d2');
gap();

// ── D2 : 동그라미의 공지 ──
cut(760, `
  ${T(W / 2, 70, '동그라미가 만든 단톡방', 36, { fill: '#5a6a78' })}
  ${chat(40, 150, ['난 내일 저녁 7시쯤 가서', '9시쯤 올 예정이야.', '갈 수 있는 사람은 가고,', '혹시 여기 톡에 없어도', '알만한 사람은 연락하고'], false, '동그라미')}
  ${sticker(dongDad({ cx: 560, cy: 590, r: 110, emo: 'good' }))}
`, '#e4e8ee');
gap();

// ── D3 : 네모와 세모의 답 ──
cut(760, `
  ${chat(40, 80, ['반장 올만..'], false, '네모')}
  ${chat(680, 230, ['쟤가 아직도 반장이냐.', '으이그..'], true, '세모')}
  ${T(W / 2, 430, '· · ·', 50, { fill: '#5a6a78' })}
  ${chat(680, 500, ['우리 수요일에 보려고 했는데,', '내일 보자 나도 간다.'], true, '세모')}
`, '#e4e8ee');
gap();

// ── D4 : 동그라미는 ──
cut(980, `
  ${sticker(dongDad({ cx: W / 2, cy: 230, r: 150, emo: 'good', item: 'condolence' }))}
  ${say(450, ['아무 감정 변화 없는 표정으로', '빠르게 부고를 전달하고,', '조화를 보낸다.'], 38)}
  ${say(730, ['댓글을 남기고,', '업무에 복귀한다.'], 38)}
`, '#2f3a55');
gap(true);

// ── D5 : 네모 ──
cut(900, `
  ${say(40, ['사실 제일 친했던 네모는'], 42)}
  ${sticker(nemoDad({ x: 210, y: 200, w: 300, h: 265, emo: 'worry' }))}
  ${think(600, ['왜 먼저', '말 걸지 못했을까?'], 56, 400, 590)}
`, C.peach);
gap(true);

// ── 끝 : 당신은 어느 도형인가요? ──
cut(1000, `
  ${T(W / 2, 110, '당신은', 60, { font: HEAD })}
  ${hl(W / 2, 200, 560, 110, C.hlY, -2)}
  ${T(W / 2, 230, '어느 도형인가요?', 64, { font: HEAD })}
  ${T(W / 2, 320, '연락하고 싶은 사람이 떠오른다면', 34)}
  ${sticker(nemoDad({ x: 50, y: 380, w: 180, h: 159, emo: 'worry' }))}
  ${sticker(semoHusband({ x: 270, y: 370, size: 180, emo: 'joy' }))}
  ${sticker(dongDad({ cx: 590, cy: 460, r: 90, emo: 'good' }))}
  ${SH.pill(W / 2, 680, '① 네모 — 미루다 후회한다', 36)}
  ${SH.pill(W / 2, 790, '② 세모 — 바로 약속을 잡는다', 36)}
  ${SH.pill(W / 2, 900, '③ 동그라미 — 할 일을 한다', 36)}
`, C.mint);

document.getElementById('strip').innerHTML = cuts.join('');
</script>
</body>
</html>
