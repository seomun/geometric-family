<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>세모 아내 — 얼굴 3안</title>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: #f4ecdd; color: #6b5443; font-family: 'Gowun Dodum', sans-serif; }
  .wrap { max-width: 900px; margin: 0 auto; padding: 24px 16px 60px; }
  h1 { font-family: Gaegu, sans-serif; font-size: 30px; margin: 0 0 4px; }
  h2 { font-family: Gaegu, sans-serif; font-size: 22px; margin: 26px 0 8px; border-bottom: 2px solid #6b5443; }
  svg { display: block; width: 100%; height: auto; }
  .lbl { font-family: 'Gowun Dodum'; font-size: 15px; fill: #6b5443; font-weight: 700; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🔺 세모 아내 — 얼굴 3안 (순수 역삼각형, 의상 없음)</h1>
  <h2>A. shoujo — 큰 눈·홍채·하이라이트 3·긴 속눈썹 &nbsp;|&nbsp; B. kitty — 검은 타원 눈·코·입 없음 &nbsp;|&nbsp; C. dot — 점 눈·ω 입</h2>
  <svg viewBox="0 0 900 400" id="big"></svg>
  <h2>표정 — good · joy · wink · love · surprise · worry (A안)</h2>
  <svg viewBox="0 0 900 200" id="emoA"></svg>
  <h2>표정 (B안 kitty)</h2>
  <svg viewBox="0 0 900 200" id="emoB"></svg>
  <h2>표정 (C안 dot)</h2>
  <svg viewBox="0 0 900 200" id="emoC"></svg>
  <h2>작은 크기(스티커·아이콘) + 남편과 나란히</h2>
  <svg viewBox="0 0 900 200" id="small"></svg>
</div>
<script src="../src/characters.js"></script>
<script>
document.body.insertAdjacentHTML('afterbegin', ROUGH_DEFS + CHAR_STYLE);
const $ = id => document.getElementById(id);
const L = (x, y, t) => `<text class="lbl" x="${x}" y="${y}" text-anchor="middle">${t}</text>`;
const styles = ['shoujo', 'kitty', 'dot'];
$('big').innerHTML = styles.map((f, i) => `<g transform="translate(${40 + i * 300},30) scale(2.4)">${semoWife({ x: 0, y: 0, size: 100, emo: 'good', faceStyle: f })}</g>` + L(160 + i * 300, 385, ['A shoujo', 'B kitty', 'C dot'][i])).join('');
const emos = ['good', 'joy', 'wink', 'love', 'surprise', 'worry'];
for (const [id, f] of [['emoA', 'shoujo'], ['emoB', 'kitty'], ['emoC', 'dot']])
  $(id).innerHTML = emos.map((e, i) => `<g transform="translate(${30 + i * 145},20) scale(1.15)">${semoWife({ x: 0, y: 0, size: 100, emo: e, faceStyle: f, pose: ['stand', 'cheer', 'hips', 'hold', 'shrug', 'think'][i], item: e === 'love' ? 'heart' : null })}</g>` + L(88 + i * 145, 190, e)).join('');
$('small').innerHTML = styles.map((f, i) => `<g transform="translate(${40 + i * 130},40) scale(.6)">${semoWife({ x: 0, y: 0, size: 100, emo: 'wink', faceStyle: f })}</g>`).join('') +
  `<g transform="translate(470,20)">${semoHusband({ x: 0, y: 0, size: 122, emo: 'good', gaze: 1 })}${semoWife({ x: 150, y: 0, size: 122, emo: 'good', gaze: -1, faceStyle: 'shoujo' })}</g>` + L(120, 190, '×0.6') + L(610, 190, '남▲ 여▽');
</script>
</body>
</html>
