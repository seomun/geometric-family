<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>쇼츠 02 — 부의금 5만원, 적나요?</title>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Gowun+Dodum&family=Nanum+Myeongjo&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: #2a2230; font-family: 'Gowun Dodum', sans-serif; }
  .frames { display: flex; flex-wrap: wrap; gap: 20px; padding: 20px; }
  .frame { width: 270px; height: 480px; }   /* 미리보기 축소. 내보내기는 1080×1920 */
  .frame svg { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<div class="frames" id="frames"></div>
<script src="../../src/characters.js"></script>
<script>
document.body.insertAdjacentHTML('afterbegin', ROUGH_DEFS + CHAR_STYLE);
GF.setMode('hand');
GF.setAssets('../../assets/');
const W = 1080, H = 1920;
const F = "font-family:'Gaegu',sans-serif", FB = "font-family:'Gowun Dodum',sans-serif", FM = "font-family:'Nanum Myeongjo',serif";
const T = (x, y, t, size, anchor = 'middle', font = FB, fill = INK, extra = '') =>
  `<text x="${x}" y="${y}" text-anchor="${anchor}" font-size="${size}" style="${font}" fill="${fill}" ${extra}>${t}</text>`;
// 큰 훅 문장 (쇼츠는 상단이 안전지대)
const hook = (lines, y = 300, size = 112, font = F) =>
  lines.map((t, i) => T(W / 2, y + size * 1.22 * i, t, size, 'middle', font, INK, 'font-weight="700"')).join('');
// 흰 자막 바
const cap = (lines, y = 210, size = 74) => {
  const h = (lines.length - 1) * size * 1.35 + size * 1.3 + 60;
  return `<rect x="60" y="${y - size - 30}" width="${W - 120}" height="${h}" rx="30" fill="#fff" stroke="${INK}" stroke-width="6"/>` +
    lines.map((t, i) => T(W / 2, y + size * 1.35 * i, t, size, 'middle', FB, INK, 'font-weight="700"')).join('');
};
// 출처 — 숫자를 쓰면 반드시 붙인다 (docs/08_SOCIAL_STATS.md §4-1)
const src = (t, y = 1830) => T(W / 2, y, t, 36, 'middle', FB, INK, 'opacity=".55"');
const label = (t, y = 1700) => T(W / 2, y, t, 50, 'middle', FM, INK, 'opacity=".72"');
const line = (y, t, size = 78) =>
  `<rect x="70" y="${y - size}" width="${W - 140}" height="${size * 1.72}" rx="${size * 0.72}" fill="#fff" stroke="${INK}" stroke-width="7"/>` +
  T(W / 2, y + size * 0.28, t, size, 'middle', F, INK);
// 가로 막대 — 통계 컷
const bar = (y, name, pct, w, color, big) => {
  const bw = (W - 300) * (pct / 100);
  return `<rect x="150" y="${y}" width="${W - 300}" height="86" rx="18" fill="#fff" stroke="${INK}" stroke-width="5"/>` +
    `<rect x="150" y="${y}" width="${bw}" height="86" rx="18" fill="${color}" stroke="${INK}" stroke-width="5"/>` +
    T(180, y + 60, name, big ? 54 : 46, 'start', F, INK) +
    T(930, y + 60, pct + '%', big ? 54 : 46, 'end', F, INK);
};

const frames = [];
const frame = (bg, inner) => frames.push(`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg"><rect width="${W}" height="${H}" fill="${bg}"/>${inner}${paper(W, H)}</svg>`);

// ── 1 (0–2.5s) 훅: 시청자에게 먼저 묻는다 ──
frame('#efe6d6', `
  ${hook(['부의금 5만원,', '적나요?'], 280, 118)}
  ${itemAt('condolence', 540, 1080, 1180)}
  ${label('2026년, 처음으로 10만원이 5만원을 넘었습니다', 1600)}
  ${src('카카오페이 송금 리포트 2026.5 · 부의금 송금 비중')}
`);

// ── 2 (2.5–5.5s) 통계 ──
frame('#f4ecdd', `
  ${cap(['실제로는 이렇습니다'], 190, 72)}
  ${bar(520, '10만원', 61.8, W, '#e2b76a', true)}
  ${bar(660, '5만원', 25.7, W, '#b7c8d6', true)}
  ${bar(800, '15만원', 7.2, W, '#d9d2c6')}
  ${bar(920, '20만원', 4.6, W, '#d9d2c6')}
  ${T(540, 1160, '평균 95,300원', 82, 'middle', F, INK)}
  ${T(540, 1330, '경조사비가 부담된다', 64, 'middle', FB, INK, 'opacity=".85"')}
  ${T(540, 1430, '65.8%', 104, 'middle', F, INK)}
  ${src('SM C&C 틸리언 프로 2026.5 · 전국 성인 1,500명')}
`);

// ── 3 안심: 5만원은 여전히 넷 중 하나, 부담은 모두 같다 ──
frame('#eef0ea', `
  ${hook(['4명 중 1명은', '여전히 5만원'], 300, 104)}
  ${T(540, 720, '25.7%', 150, 'middle', F, INK)}
  ${nemoDad({ x: 350, y: 820, w: 380, h: 337, emo: 'good', suit: true })}
  ${T(540, 1400, '3명 중 2명은 "부담된다" (65.8%)', 58, 'middle', FB, INK)}
  ${label('고민하는 건, 다 같은 마음', 1560)}
  ${src('SM C&C 틸리언 프로 2026.5 · 전국 성인 1,500명')}
`);

// ── 4 원작 대사 — 정답은 아무도 모른다 ──
frame('#e6e1d8', `
  ${nemoDad({ x: 120, y: 620, w: 340, h: 301, emo: 'worry', suit: true, gaze: 1 })}
  ${dongDad({ cx: 790, cy: 780, r: 165, emo: 'calm', suit: true })}
  ${line(1150, '"넌 얼마나 했냐?"', 74)}
  ${line(1420, '"뭐 그런 거 알아 뭐하게"', 62)}
  ${label('끝내 묻고 말았다', 1660)}
`);

// ── 5 착지 — 5만원도 괜찮다 + 작가의 문장 ──
frame('#efe6d6', `
  ${hook(['5만원도 괜찮아요'], 280, 110)}
  ${T(540, 420, '그냥 형편껏 하고,', 64, 'middle', FM, INK)}
  ${T(540, 510, '마음만 잘 전달되기를…', 64, 'middle', FM, INK)}
  ${nemoDad({ x: 350, y: 800, w: 380, h: 337, emo: 'good', suit: true })}
  ${T(540, 1330, '당신은?', 68, 'middle', F, INK)}
  ${T(230, 1450, '① 5만', 58, 'middle', FB, INK)}
  ${T(540, 1450, '② 10만', 58, 'middle', FB, INK)}
  ${T(860, 1450, '③ 형편껏', 58, 'middle', FB, INK)}
  ${T(540, 1660, '기하학 가족', 72, 'middle', F, INK, 'letter-spacing="8"')}
  ${T(540, 1740, 'seomun.github.io/geometric-family', 38, 'middle', FB, INK, 'opacity=".6"')}
`);

document.getElementById('frames').innerHTML = frames.map((f, i) => `<div class="frame" id="f${i + 1}">${f}</div>`).join('');
</script>
</body>
</html>
