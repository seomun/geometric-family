<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>쇼츠 02 — 부의금 5만원, 괜찮아요</title>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Jua&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: #2a2230; }
  .frames { display: flex; flex-wrap: wrap; gap: 20px; padding: 20px; }
  .frame { width: 270px; height: 480px; }   /* 미리보기 축소. 내보내기는 1080×1920 */
  .frame svg { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<div class="frames" id="frames"></div>
<script src="../../src/characters.js"></script>
<script src="_shorts.js"></script>
<script>
// 화풍 v2 — 공용 규칙은 _shorts.js. 이 파일은 컷 내용만.
document.body.insertAdjacentHTML('afterbegin', ROUGH_DEFS + CHAR_STYLE + SH.DEFS);
GF.setMode('clean');
GF.setAssets('../../assets/');
const { W, C, T, head, hl, sticker, pill, src, env, cloud, frame, brand, HEAD, BODY } = SH;

// ── 1 훅 ──
frame(C.yellow, `
  ${T(540, 300, '부의금', 120, { font: HEAD, outline: 14 })}
  ${hl(540, 440, 640, 150, '#fff', -3)}
  ${head(['5만원,', '적나요?'], 500, 170)}
  ${sticker(env(540, 1000, 440, '5만', -6))}
  ${T(540, 1330, '2026년, 처음으로', 76, { outline: 12 })}
  ${T(540, 1425, '10만원이 5만원을 넘었다', 76, { outline: 12 })}
  ${src('카카오페이 송금 리포트 2026.5', 1540)}
`);

// ── 2 통계 — 막대 두 개만 ──
const bar = (y, name, pct, color) => { const full = 820, bw = full * pct / 100;
  return `<rect x="130" y="${y + 12}" width="${full}" height="150" rx="30" fill="#2b2118"/>` +
    `<rect x="120" y="${y}" width="${full}" height="150" rx="30" fill="#fff" stroke="#2b2118" stroke-width="8"/>` +
    `<rect x="120" y="${y}" width="${bw}" height="150" rx="30" fill="${color}" stroke="#2b2118" stroke-width="8"/>` +
    T(160, y + 102, name, 76, { anchor: 'start', font: HEAD }) + T(920, y + 102, pct + '%', 76, { anchor: 'end', font: HEAD }); };
frame(C.cream, `
  ${head(['실제로는?'], 330, 150)}
  ${bar(520, '10만원', 61.8, C.yellow)}
  ${bar(740, '5만원', 25.7, C.hlB)}
  ${T(540, 1100, '평균', 76)}
  ${hl(540, 1210, 700, 130, C.hlY, -2)}
  ${T(540, 1255, '95,300원', 150, { font: HEAD })}
  ${src('SM C&C 틸리언 프로 2026.5 · 전국 성인 1,500명')}
`);

// ── 3 안심 — 넷 중 하나 ──
const four = [0, 1, 2, 3].map(i => { const x = 80 + i * 245, on = i === 3;
  return `<g opacity="${on ? 1 : 0.28}">${nemoDad({ x, y: 700, w: 175, h: 155, emo: on ? 'joy' : 'good', suit: true })}</g>`; }).join('');
frame(C.mint, `
  ${head(['4명 중 1명은'], 330, 140)}
  ${hl(540, 450, 760, 140, C.hlY, -2)}
  ${head(['여전히 5만원'], 500, 150, { outline: 0 })}
  ${sticker(four)}
  ${sticker(env(910, 960, 170, '5만', 8))}
  ${T(540, 1180, '3명 중 2명은', 84, { outline: 12 })}
  ${T(540, 1300, '"부담돼요"', 110, { font: HEAD, outline: 14 })}
  ${src('SM C&C 틸리언 프로 2026.5 · 전국 성인 1,500명')}
`);

// ── 4 두 가족의 봉투 — 세모는 고민 없이 10만, 네모의 속마음 ──
frame(C.cream, `
  <rect x="0" y="0" width="540" height="1080" fill="${C.sky}"/>
  <rect x="540" y="0" width="540" height="1080" fill="${C.peach}"/>
  ${T(270, 250, '세모네', 120, { font: HEAD, outline: 14 })}
  ${T(270, 340, '맞벌이·아이 없음', 56, { outline: 10 })}
  ${T(810, 250, '네모네', 120, { font: HEAD, outline: 14 })}
  ${T(810, 340, '아이 넷', 56, { outline: 10 })}
  ${sticker(semoHusband({ x: 110, y: 450, size: 320, emo: 'joy', suit: true }))}
  ${sticker(env(270, 920, 250, '10만', -10))}
  ${T(450, 850, '척!', 90, { font: HEAD, outline: 12, rot: 12 })}
  ${sticker(nemoDad({ x: 650, y: 500, w: 320, h: 283, emo: 'good', suit: true }))}
  ${sticker(env(810, 920, 220, '5만', 5))}
  ${cloud(540, 1330, 960, 420)}
  <circle cx="820" cy="1085" r="26" fill="#fff" stroke="#2b2118" stroke-width="7"/>
  <circle cx="850" cy="1030" r="14" fill="#fff" stroke="#2b2118" stroke-width="6"/>
  ${T(540, 1270, '내 5만원이 훨씬', 84, { font: HEAD })}
  ${T(540, 1370, '가치 있다는 걸', 84, { font: HEAD })}
  ${T(540, 1470, '알아둬라…', 84, { font: HEAD })}
`);

// ── 5 착지 — 5만원도 괜찮다 ──
frame(C.pink, `
  ${hl(540, 330, 720, 150, '#fff', -3)}
  ${head(['5만원도', '괜찮아요'], 380, 170)}
  ${T(540, 720, '그냥 형편껏 하고,', 72, { outline: 12 })}
  ${T(540, 815, '마음만 잘 전달되기를', 72, { outline: 12 })}
  ${sticker(nemoDad({ x: 405, y: 860, w: 270, h: 239, emo: 'joy', suit: true }))}
  ${T(540, 1265, '당신은?', 90, { font: HEAD, outline: 14 })}
  ${pill(320, 1385, '① 5만', 58)}
  ${pill(740, 1385, '② 10만', 58)}
  ${pill(540, 1510, '③ 형편껏', 58)}
  ${T(540, 170, '기하학 가족', 56, { font: HEAD, extra: 'letter-spacing="8"' })}
`);

SH.mount();
</script>
</body>
</html>
