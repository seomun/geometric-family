<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>기하학 가족 — 손 터치 비교</title>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: #f4ecdd; color: #3d2b1f; font-family: 'Gowun Dodum', sans-serif; }
  .wrap { max-width: 900px; margin: 0 auto; padding: 24px 16px 60px; }
  h1 { font-family: Gaegu, sans-serif; font-size: 30px; margin: 0 0 4px; }
  h2 { font-family: Gaegu, sans-serif; font-size: 22px; margin: 26px 0 8px; border-bottom: 2px solid #3d2b1f; }
  svg { display: block; width: 100%; height: auto; }
  .lbl { font-family: 'Gowun Dodum'; font-size: 15px; fill: #3d2b1f; font-weight: 700; }
</style>
</head>
<body>
<div class="wrap">
  <h1>손 터치 비교 — clean(벡터 원본) vs hand(선 흔들림·굵기 변화·칠 어긋남·종이 결)</h1>
  <h2>세모 아내 · 네모 아빠 · 동그라미 아빠 (×2)</h2>
  <svg viewBox="0 0 900 420" id="cmp"></svg>
  <h2>확대 ×3.5 — 선 굵기와 칠 어긋남</h2>
  <svg viewBox="0 0 900 460" id="zoom"></svg>
  <h2>컷 예시 — hand 모드 + 종이 결</h2>
  <svg viewBox="0 0 900 380" id="cut"></svg>
</div>
<script src="../src/characters.js"></script>
<script>
document.body.insertAdjacentHTML('afterbegin', ROUGH_DEFS + CHAR_STYLE);
const $ = id => document.getElementById(id);
const L = (x, y, t) => `<text class="lbl" x="${x}" y="${y}" text-anchor="middle">${t}</text>`;
function trio(x, y, k) { return `<g transform="translate(${x},${y}) scale(${k})">` + semoWife({ x: 0, y: 0, size: 122, emo: 'wink', pose: 'hips' }) + nemoDad({ x: 160, y: 8, emo: 'good', pose: 'wave' }) + dongDad({ cx: 380, cy: 60, r: 48, emo: 'good', pose: 'think' }) + '</g>'; }
GF.setMode('clean'); let a = trio(20, 40, 1); GF.setMode('hand'); let b = trio(470, 40, 1);
$('cmp').innerHTML = a + b + L(230, 30, 'clean') + L(680, 30, 'hand') + paper(900, 420, 0, 0).replace('filter', 'opacity=".0" filter');
GF.setMode('clean'); a = `<g transform="translate(40,20) scale(3.5)">${semoWife({ x: 0, y: 0, size: 100, emo: 'good', pose: 'stand' })}</g>`;
GF.setMode('hand'); b = `<g transform="translate(480,20) scale(3.5)">${semoWife({ x: 0, y: 0, size: 100, emo: 'good', pose: 'stand' })}</g>`;
$('zoom').innerHTML = a + b;
GF.setMode('hand');
$('cut').innerHTML = `<rect width="900" height="380" fill="#f4ecdd"/>` + windowBg('skyT', '#cfe3f4', '#f0e6d2', '#d9c7ad', '#efe6d6', 900, 380) +
  nemoDad({ x: 250, y: 200, w: 120, h: 106, emo: 'worry', pose: 'hold', item: 'coffee' }) + semoHusband({ x: 480, y: 190, size: 122, emo: 'sad', gaze: -1, pose: 'think' }) +
  speech(60, 40, 300, ['오늘도 창가에서', '커피 한 잔.'], { tail: 'right' }) + paper(900, 380);
</script>
</body>
</html>
